<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Modding Downloads — Dani_MK</title>

<link rel="icon" href="favicon.ico" type="image/x-icon">

<style>
:root{
  --bg:#07070c;
  --glass:rgba(255,255,255,0.06);
  --border:rgba(255,255,255,0.08);
  --accent1:#7f5cff;
  --accent2:#00ffd5;
  --text:#f5f7fa;
  --muted:#b8bfd4;
}

*{box-sizing:border-box;margin:0;padding:0;}

body{
  font-family:system-ui,SegoeUI,Arial,sans-serif;
  background:
    radial-gradient(600px 400px at 10% 10%, rgba(127,92,255,.15), transparent),
    radial-gradient(600px 400px at 90% 90%, rgba(0,255,213,.12), transparent),
    linear-gradient(180deg,#050509,#0b0b16);
  color:var(--text);
  min-height:100vh;
}

.downloads .download-btn{
  display:block;
  width:100%;
}

.download-btn{
  display:block;
  text-align:center;
  text-decoration:none;
}

.container{
  max-width:1200px;
  margin:auto;
  padding:40px 30px;
}

.card{
  background:var(--glass);
  border:1px solid var(--border);
  border-radius:26px;
  padding:60px 50px;
  backdrop-filter:blur(14px);
  box-shadow:0 20px 60px rgba(0,0,0,.6);
  text-align:center;
  max-width:700px;
  margin:auto;
}

.card h1{
  font-size:36px;
}

.card h1 span{
  background:linear-gradient(90deg,var(--accent1),var(--accent2));
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

.subtitle{
  margin-top:10px;
  color:var(--muted);
  margin-bottom:40px;
}

.downloads{
  display:flex;
  flex-direction:column;
  gap:18px;
}

.download-row{
  display:flex;
  gap:10px;
  align-items:center;
}

.download-row .download-btn:hover + .github-btn{
  transform:translateX(8px);
}

.download-row .download-btn:only-child{
  width:calc(100% - 55px);
}

.download-row .download-btn{
  transition:transform .2s ease, box-shadow .2s ease;
}

.github-btn{
  width:45px;
  height:45px;

  padding:0;

  border:none;
  border-radius:14px;

  background:var(--glass);
  border:1px solid var(--border);

  color:white;

  display:flex;
  align-items:center;
  justify-content:center;

  cursor:pointer;

  transition:.2s;
}

.github-btn:hover{
  background:rgba(255,255,255,.18);
  transform:scale(1.06);
}

.github-btn svg{
  width:20px;
  height:20px;
}

.download-btn{
  padding:20px;
  font-size:18px;
  font-weight:700;
  border:none;
  border-radius:18px;
  cursor:pointer;
  background:linear-gradient(90deg,var(--accent1),var(--accent2));
  color:#050509;
  transition:transform .2s, box-shadow .2s;
  box-shadow:0 10px 30px rgba(0,0,0,.4);
}

.download-btn:hover{
  transform:scale(1.06);
  box-shadow:0 18px 50px rgba(0,0,0,.6);
}

.download-row{
  overflow:visible;
}

.download-row .download-btn:hover{
  transform:scale(1.04);
  box-shadow:0 18px 50px rgba(0,0,0,.6);
}

.download-btn.ghost{
  background:var(--glass);
  color:var(--text);
  border:1px solid(var(--border));
}

.download-btn.ghost:hover{
  background:rgba(255,255,255,0.1);
}

/* POPUP */

.popup-overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.75);
  display:flex;
  align-items:center;
  justify-content:center;
  opacity:0;
  visibility:hidden;
  transition:.25s;
  z-index:5000;
}

.popup-overlay.show{
  opacity:1;
  visibility:visible;
}

.popup{
  width:360px;
  background:#10101a;
  border:1px solid var(--border);
  border-radius:22px;
  padding:30px;
  text-align:center;
  box-shadow:0 20px 60px rgba(0,0,0,.7);

  transform:scale(.92);
  transition:.25s ease;
}

.popup h2{
  margin-bottom:20px;
}

/* MENU CUSTOM */

.custom-select{
  margin-bottom:0;
}

.select-button{
  width:100%;
  padding:15px;
  border:none;
  border-radius:14px;
  background:#181825;
  color:white;
  font-size:16px;
  font-weight:700;
  cursor:pointer;
}

.select-menu{

  background:#181825;
  border-radius:14px;
  overflow:hidden;
  border:1px solid var(--border);

  max-height:0;
  opacity:0;

  margin-top:0;

  transition:
    max-height .25s ease,
    opacity .25s ease,
    margin-top .25s ease;

}

.select-menu.show{

  max-height:90px;
  opacity:1;

  margin-top:8px;

}

.select-menu div{
  padding:9px 14px;
  font-size:14px;
}

.select-menu div:hover{
  background:rgba(255,255,255,0.12);
  color:var(--text);
}

.popup-buttons{
  display:flex;
  gap:12px;

  opacity:0;
  max-height:0;
  overflow:hidden;

  pointer-events:none;

  margin-top:0;
  transform:translateY(-8px);

  transition:
    opacity .25s ease,
    max-height .25s ease,
    margin-top .25s ease,
    transform .25s ease;
}


.popup-buttons:not(.hidden){
  opacity:1;

  max-height:80px;

  pointer-events:auto;

  margin-top:18px;

  transform:translateY(0);
}

.cancel-btn{
  flex:1;
  border:none;
  border-radius:18px;
  background:#2d2d38;
  color:white;
  font-weight:700;
  cursor:pointer;
}

#downloadPopupBtn{
  flex:1;
}

#downloadPopupBtn:disabled{
  opacity:.45;
  cursor:not-allowed;
  transform:none;
}


/* TA NAVBAR ORIGINALE */

.bottom-nav{
  position:fixed;
  bottom:18px;
  left:50%;
  transform:translateX(-50%);
  display:flex;
  gap:10px;
  padding:10px;
  background:rgba(0,0,0,.6);
  border:1px solid(var(--border));
  border-radius:999px;
  backdrop-filter:blur(10px);
  z-index:1000;
}

.bottom-nav button{
  padding:10px 16px;
  border-radius:14px;
  border:none;
  background:transparent;
  color:var(--muted);
  font-weight:700;
  cursor:pointer;
  transition:transform 0.2s ease, background 0.2s ease;
}

.bottom-nav button:hover{
  transform:scale(1.08);
  background:linear-gradient(90deg,var(--accent1),var(--accent2));
  color:#050509;
}

footer{
  margin-top:40px;
  font-size:13px;
  color:var(--muted);
}

.popup-buttons .download-btn,
.popup-buttons .cancel-btn{
  padding:12px 16px;
  font-size:15px;
  border-radius:14px;
}

#downloadPopupBtn{
  background:linear-gradient(90deg,#00ff88,#00c853);
  color:#050509;
}

#downloadPopupBtn:hover{
  background:linear-gradient(90deg,#00ff88,#00e676);
}

.select-menu div{
  padding:10px 14px;
  font-size:14px;
}

.select-button{
  padding:12px 14px;
  font-size:15px;
}

.hidden{
  opacity:0;
  transform:translateY(-12px);
  max-height:0;
  overflow:hidden;
  pointer-events:none;
  margin-top:0;
}

</style>
</head>

<body>


<div class="container">

<div class="card">

<h1>Modding <span>Downloads</span></h1>

<div class="subtitle">
Télécharge les fichiers de Modding
</div>

<div class="downloads">


<div class="download-row">

<a class="download-btn"
href="https://github.com/Kirbymimi/Spotlight/releases/download/Whatever/Moonlight.zip"
download>

href="https://github.com/Kirbymimi/Spotlight"
target="_blank">

</svg>

</div>




<div class="download-row">

<a class="download-btn"
onclick="openPopup()">

<a class="github-btn"
href="https://github.com/Amethyst-szs/MoonFlow"
target="_blank">

<svg viewBox="0 0 24 24" fill="currentColor">
<path d="M12 .5a12 12 0 0 0-3.8 23.4c.6.1.8-.3.8-.6v-2.2c-3.3.7-4-1.6-4-1.6-.5-1.4-1.3-1.8-1.3-1.8-1.1-.7.1-.7.1-.7 1.2.1 1.8 1.2 1.8 1.2 1.1 1.8 2.8 1.3 3.5 1 .1-.8.4-1.3.8-1.6-2.7-.3-5.5-1.3-5.5-6 0-1.3.5-2.4 1.2-3.2-.1-.3-.5-1.5.1-3.2 0 0 1-.3 3.3 1.2a11.5 11.5 0 0 1 6 0c2.3-1.5 3.3-1.2 3.3-1.2.7 1.7.2 2.9.1 3.2.8.8 1.2 1.9 1.2 3.2 0 4.6-2.8 5.7-5.5 6 .4.4.8 1.1.8 2.2v3.3c0 .3.2.7.8.6A12 12 0 0 0 12 .5z"/>

</div>


<div class="download-row">

<button class="download-btn ghost">

Télécharger • Fichier à venir

</button>

</div>

</div>

<footer>
© 2026 — Dani_MK
</footer>

</div>
</div>



<div id="downloadPopup" class="popup-overlay">

<div class="popup">

<h2>Télécharger MoonFlow</h2>


<div class="custom-select">

<button id="selectButton" class="select-button" onclick="toggleSelect()">
Choisir un système ▼
</button>


<div id="selectMenu" class="select-menu">

<div onclick="chooseOS('windows')">
🪟 Windows
</div>

<div onclick="chooseOS('linux')">
🐧 Linux
</div>

</div>

</div>


<div id="popupButtons" class="popup-buttons hidden">

<button class="cancel-btn" onclick="closePopup()">
Annuler
</button>

<button id="downloadPopupBtn" class="download-btn" onclick="downloadSelected()">
Download
</button>

</div>

</div>

</div>



<nav class="bottom-nav">

<button onclick="go('index.html')">Accueil</button>
<button onclick="go('totk.html')">TOTK</button>
<button onclick="go('smo.html')">SMO</button>
<button onclick="go('chatsmo.html')">ChatSmo</button>
<button onclick="go('botw.html')">BOTW</button>

</nav>



<script>

let selectedOS="";


function go(page){
  window.location.href=page;
}


function openPopup(){
 document.getElementById("downloadPopup").classList.add("show");
}


function closePopup(){

  document.getElementById("downloadPopup").classList.remove("show");

  setTimeout(() => {

    selectedOS="";

    document.getElementById("selectButton").innerHTML =
    "Choisir un système ▼";

    document.getElementById("selectMenu").classList.remove("show");

    document.querySelector(".popup")
    .classList.remove("expanded");

    document.getElementById("popupButtons")
    .classList.add("hidden");


    updateDownloadButton();

  }, 250);

}

document.getElementById("downloadPopup").addEventListener("click", function(e){

  if(e.target === this){
    closePopup();
  }

});

function toggleSelect(){
 document.getElementById("selectMenu").classList.toggle("show");
}


function chooseOS(os){

  selectedOS=os;

  document.getElementById("selectButton").innerHTML =
  os==="windows"
  ?"🪟 Windows ▼"
  :"🐧 Linux ▼";

  document.getElementById("selectMenu").classList.remove("show");

  let buttons = document.getElementById("popupButtons");

  buttons.classList.remove("hidden");

  updateDownloadButton();

}


function updateDownloadButton(){

 document.getElementById("downloadPopupBtn").disabled = selectedOS==="";

}


function downloadSelected(){

 if(selectedOS==="windows"){
 window.location.href="https://github.com/Amethyst-szs/MoonFlow/releases/download/v1.3.5/win-x86_64.zip";
 }


 if(selectedOS==="linux"){
 window.location.href="https://github.com/Amethyst-szs/MoonFlow/releases/download/v1.3.5/linux-x86_64.zip";
 }

 closePopup();

}

</script>


</body>
