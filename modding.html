<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Modding Downloads — Dani_MK</title>

<link rel="icon" href="favicon.ico" type="image/x-icon">

<style>
:root{
  --bg:#07070c;
  --glass:rgba(255,255,255,0.06);
  --border:rgba(255,255,255,0.08);
  --accent1:#7f5cff;
  --accent2:#00ffd5;
  --text:#f5f7fa;
  --muted:#b8bfd4;
}

*{box-sizing:border-box;margin:0;padding:0;}

body{
  font-family:system-ui,SegoeUI,Arial,sans-serif;
  background:
    radial-gradient(600px 400px at 10% 10%, rgba(127,92,255,.15), transparent),
    radial-gradient(600px 400px at 90% 90%, rgba(0,255,213,.12), transparent),
    linear-gradient(180deg,#050509,#0b0b16);
  color:var(--text);
  min-height:100vh;
}

.downloads .download-btn{
  display:block;
  width:100%;
}

.download-btn{
  display:block;
  text-align:center;
  text-decoration:none;
}

.container{
  max-width:1200px;
  margin:auto;
  padding:40px 30px;
}

.card{
  background:var(--glass);
  border:1px solid var(--border);
  border-radius:26px;
  padding:60px 50px;
  backdrop-filter:blur(14px);
  box-shadow:0 20px 60px rgba(0,0,0,.6);
  text-align:center;
  max-width:700px;
  margin:auto;
}

.card h1{
  font-size:36px;
}

.card h1 span{
  background:linear-gradient(90deg,var(--accent1),var(--accent2));
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

.subtitle{
  margin-top:10px;
  color:var(--muted);
  margin-bottom:40px;
}

.downloads{
  display:flex;
  flex-direction:column;
  gap:18px;
}

.download-row{
  display:flex;
  gap:10px;
  align-items:center;
}

.download-row .download-btn:hover + .github-btn{
  transform:translateX(8px);
}

.download-row .download-btn:only-child{
  width:calc(100% - 55px);
}

.download-row .download-btn{
  transition:transform .2s ease, box-shadow .2s ease;
}

.github-btn{
  width:45px;
  height:45px;

  padding:0;

  border:none;
  border-radius:14px;

  background:var(--glass);
  border:1px solid var(--border);

  color:white;

  display:flex;
  align-items:center;
  justify-content:center;

  cursor:pointer;

  transition:.2s;
}

.github-btn:hover{
  background:rgba(255,255,255,.18);
  transform:scale(1.06);
}

.github-btn svg{
  width:20px;
  height:20px;
}

.download-btn{
  padding:20px;
  font-size:18px;
  font-weight:700;
  border:none;
  border-radius:18px;
  cursor:pointer;
  background:linear-gradient(90deg,var(--accent1),var(--accent2));
  color:#050509;
  transition:transform .2s, box-shadow .2s;
  box-shadow:0 10px 30px rgba(0,0,0,.4);
}

.download-btn:hover{
  transform:scale(1.06);
  box-shadow:0 18px 50px rgba(0,0,0,.6);
}

.download-row{
  overflow:visible;
}

.download-row .download-btn:hover{
  transform:scale(1.04);
  box-shadow:0 18px 50px rgba(0,0,0,.6);
}

.download-btn.ghost{
  background:var(--glass);
  color:var(--text);
  border:1px solid(var(--border));
}

.download-btn.ghost:hover{
  background:rgba(255,255,255,0.1);
}

/* POPUP */

.popup-overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.75);
  display:flex;
  align-items:center;
  justify-content:center;
  opacity:0;
  visibility:hidden;
  transition:.25s;
  z-index:5000;
}

.popup-overlay.show{
  opacity:1;
  visibility:visible;
}

.popup{
  width:360px;
  background:#10101a;
  border:1px solid var(--border);
  border-radius:22px;
  padding:30px;
  text-align:center;
  box-shadow:0 20px 60px rgba(0,0,0,.7);

  transform:scale(.92);
  transition:.25s ease;
}

.popup h2{
  margin-bottom:20px;
}

/* MENU CUSTOM */

.custom-select{
  margin-bottom:0;
}

.select-button{
  width:100%;
  padding:15px;
  border:none;
  border-radius:14px;
  background:#181825;
  color:white;
  font-size:16px;
  font-weight:700;
  cursor:pointer;
}

.select-menu{

  background:#181825;
  border-radius:14px;
  overflow:hidden;
  border:1px solid var(--border);

  max-height:0;
  opacity:0;

  margin-top:0;

  transition:
    max-height .25s ease,
    opacity .25s ease,
    margin-top .25s ease;

}

.select-menu.show{

  max-height:90px;
  opacity:1;

  margin-top:8px;

}

.select-menu div{
  padding:9px 14px;
  font-size:14px;
}

.select-menu div:hover{
  background:rgba(255,255,255,0.12);
  color:var(--text);
}

.popup-buttons{
  display:flex;
  gap:12px;

  opacity:0;
  max-height:0;
  overflow:hidden;

  pointer-events:none;

  margin-top:0;
  transform:translateY(-8px);

  transition:
    opacity .25s ease,
    max-height .25s ease,
    margin-top .25s ease,
    transform .25s ease;
}


.popup-buttons:not(.hidden){
  opacity:1;

  max-height:80px;

  pointer-events:auto;

  margin-top:18px;

  transform:translateY(0);
}

.cancel-btn{
  flex:1;
  border:none;
  border-radius:18px;
  background:#2d2d38;
  color:white;
  font-weight:700;
  cursor:pointer;
}

#downloadPopupBtn{
  flex:1;
}

#downloadPopupBtn:disabled{
  opacity:.45;
  cursor:not-allowed;
  transform:none;
}


/* TA NAVBAR ORIGINALE */

.bottom-nav{
  position:fixed;
  bottom:18px;
  left:50%;
  transform:translateX(-50%);
  display:flex;
  gap:10px;
  padding:10px;
  background:rgba(0,0,0,.6);
  border:1px solid(var(--border));
  border-radius:999px;
  backdrop-filter:blur(10px);
  z-index:1000;
}

.bottom-nav button{
  padding:10px 16px;
  border-radius:14px;
  border:none;
  background:transparent;
  color:var(--muted);
  font-weight:700;
  cursor:pointer;
  transition:transform 0.2s ease, background 0.2s ease;
}

.bottom-nav button:hover{
  transform:scale(1.08);
  background:linear-gradient(90deg,var(--accent1),var(--accent2));
  color:#050509;
}

footer{
  margin-top:40px;
  font-size:13px;
  color:var(--muted);
}

.popup-buttons .download-btn,
.popup-buttons .cancel-btn{
  padding:12px 16px;
  font-size:15px;
  border-radius:14px;
}

#downloadPopupBtn{
  background:linear-gradient(90deg,#00ff88,#00c853);
  color:#050509;
}

#downloadPopupBtn:hover{
  background:linear-gradient(90deg,#00ff88,#00e676);
}

.select-menu div{
  padding:10px 14px;
  font-size:14px;
}

.select-button{
  padding:12px 14px;
  font-size:15px;
}

.hidden{
  opacity:0;
  transform:translateY(-12px);
  max-height:0;
  overflow:hidden;
  pointer-events:none;
  margin-top:0;
}

/* ===== HAMBURGER + DRAWER ===== */
.hamburger,.drawer,.drawer-overlay{ display:none; }

.hamburger span{ display:block; width:20px; height:2px; background:#fff; border-radius:2px; transition:transform 0.35s cubic-bezier(0.4,0,0.2,1),opacity 0.22s ease; }
.hamburger.open span:nth-child(1){ transform:translateY(7px) rotate(45deg); }
.hamburger.open span:nth-child(2){ opacity:0; transform:scaleX(0); }
.hamburger.open span:nth-child(3){ transform:translateY(-7px) rotate(-45deg); }
@keyframes ham-pop{ 0%{ transform:scale(1); } 45%{ transform:scale(1.22); } 100%{ transform:scale(1); } }

.drawer-overlay.show{ opacity:1; pointer-events:auto; }
.drawer.open{ transform:translateX(0); }
.drawer-header{ padding:38px 20px 34px 20px; display:flex; align-items:center; justify-content:center; border-bottom:1px solid rgba(255,255,255,0.06); }
.drawer-title{ font-weight:900; font-size:17px; background:linear-gradient(90deg,#7f5cff,#00ffd5); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
.drawer-links{ flex:1; display:flex; flex-direction:column; gap:8px; padding:20px 14px; overflow-y:auto; }
.drawer-links button{ width:100%; padding:15px 18px; background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.07); border-radius:14px; color:#f5f7fa; font-family:inherit; font-weight:700; font-size:15px; cursor:pointer; text-align:left; transition:background 0.15s,transform 0.15s,border-color 0.15s; }
.drawer-links button:hover{ background:rgba(127,92,255,0.12); border-color:rgba(127,92,255,0.28); transform:translateX(4px); }
.drawer-links button:active{ transform:scale(0.97); }
.drawer-footer{ padding:14px 20px; padding-bottom:max(14px,env(safe-area-inset-bottom)); font-size:12px; color:rgba(255,255,255,0.22); border-top:1px solid rgba(255,255,255,0.05); text-align:center; }

@media(max-width:800px){
  .bottom-nav{ display:none; }
  .hamburger{ display:flex; flex-direction:column; justify-content:center; align-items:center; gap:5px; position:fixed; top:calc(env(safe-area-inset-top,0px) + 24px); left:25px; z-index:3000; width:48px; height:48px; background:rgba(7,7,12,0.88); border:1px solid rgba(255,255,255,0.14); border-radius:14px; cursor:pointer; backdrop-filter:blur(16px); box-shadow:0 8px 30px rgba(0,0,0,0.5),0 0 0 1px rgba(127,92,255,0.15); transition:transform 0.25s ease,background 0.35s ease,box-shadow 0.35s ease,border-color 0.35s ease; }
  .hamburger:active{ transform:scale(0.9); }
  .hamburger.open{ animation:ham-pop 0.32s cubic-bezier(0.34,1.56,0.64,1); }
  .drawer-overlay{ display:block; position:fixed; inset:0; background:rgba(0,0,0,0.55); backdrop-filter:blur(3px); z-index:1500; opacity:0; pointer-events:none; transition:opacity 0.3s ease; }
  .drawer{ display:flex; position:fixed; top:0; left:0; width:75vw; max-width:280px; height:100vh; height:100dvh; background:rgba(7,7,16,0.97); border-right:1px solid rgba(255,255,255,0.07); backdrop-filter:blur(24px); z-index:2000; flex-direction:column; transform:translateX(-100%); transition:transform 0.32s cubic-bezier(0.4,0,0.2,1); box-shadow:20px 0 60px rgba(0,0,0,0.5); }
}
@media(max-width:480px){
  .container{ padding:12px; }
  .card{ padding:24px 14px; }
  .popup{ width:min(360px,90vw); padding:22px 16px; }
}

</style>
</head>

<body>

<div id="downloadPopup" class="popup-overlay">

<div class="popup">

<h2>Télécharger MoonFlow</h2>


<div class="custom-select">

<button id="selectButton" class="select-button" onclick="toggleSelect()">
Choisir un système ▼
</button>

<div onclick="chooseOS('windows')">
🪟 Windows

Annuler
</button>

  <button onclick="go('index.html')">Accueil</button>

  <button onclick="go('chatsmo.html')">ChatSmo</button>
  <button onclick="go('botw.html')">BOTW</button>
</nav>

<button class="hamburger" id="hamburger" aria-label="Menu"><span></span><span></span><span></span></button>
<div class="drawer-overlay" id="drawerOverlay"></div>
<nav class="drawer" id="drawer">
  <div class="drawer-header"><span class="drawer-title">Navigation</span></div>
  <div class="drawer-links">
    <button onclick="go('index.html')">Accueil</button>
    <button onclick="go('totk.html')">TOTK</button>
    <button onclick="go('smo.html')">SMO</button>
    <button onclick="go('chatsmo.html')">ChatSmo</button>
    <button onclick="go('botw.html')">BOTW</button>
  </div>
  <div class="drawer-footer">© 2026 — Dani_MK</div>
</nav>

<script>

let selectedOS="";


function go(page){
  window.location.href=page;
}


function openPopup(){
 document.getElementById("downloadPopup").classList.add("show");
}


function closePopup(){

  document.getElementById("downloadPopup").classList.remove("show");

  setTimeout(() => {

    selectedOS="";

    document.getElementById("selectButton").innerHTML =
    "Choisir un système ▼";

    document.getElementById("selectMenu").classList.remove("show");

    document.querySelector(".popup")
    .classList.remove("expanded");

    document.getElementById("popupButtons")
    .classList.add("hidden");


    updateDownloadButton();

  }, 250);

}

document.getElementById("downloadPopup").addEventListener("click", function(e){

  if(e.target === this){
    closePopup();
  }

});

function toggleSelect(){
 document.getElementById("selectMenu").classList.toggle("show");
}


function chooseOS(os){

  selectedOS=os;

  document.getElementById("selectButton").innerHTML =
  os==="windows"
  ?"🪟 Windows ▼"
  :"🐧 Linux ▼";

  document.getElementById("selectMenu").classList.remove("show");

  let buttons = document.getElementById("popupButtons");

  buttons.classList.remove("hidden");

  updateDownloadButton();

}


function updateDownloadButton(){

 document.getElementById("downloadPopupBtn").disabled = selectedOS==="";

}


function downloadSelected(){

 if(selectedOS==="windows"){
 window.location.href="https://github.com/Amethyst-szs/MoonFlow/releases/download/v1.3.5/win-x86_64.zip";
 }


 if(selectedOS==="linux"){
 window.location.href="https://github.com/Amethyst-szs/MoonFlow/releases/download/v1.3.5/linux-x86_64.zip";
 }

 closePopup();

}

(function(){
  var ham=document.getElementById('hamburger'),drw=document.getElementById('drawer'),ovr=document.getElementById('drawerOverlay');
  function openDrw(){ham.classList.add('open');drw.classList.add('open');ovr.classList.add('show');document.body.style.overflow='hidden';}
  function closeDrw(){ham.classList.remove('open');drw.classList.remove('open');ovr.classList.remove('show');document.body.style.overflow='';}
  ham.addEventListener('click',function(){drw.classList.contains('open')?closeDrw():openDrw();});
  ovr.addEventListener('click',closeDrw);
  document.addEventListener('keydown',function(e){if(e.key==='Escape')closeDrw();});
})();

</script>
