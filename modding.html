/* ===== POPUP (choix d'OS pour MoonFlow) ===== */
.popup-overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.7);
  display:flex;
  align-items:center;
  justify-content:center;
  opacity:0;
  visibility:hidden;
  transition:opacity .25s ease, visibility .25s ease;
  z-index:5000;
  backdrop-filter:blur(4px);
}
.popup-overlay.show{ opacity:1; visibility:visible; }

.popup{
  width:360px;
  background:var(--bg-1);
  border:1px solid var(--border);
  border-radius:var(--radius-lg);
  padding:30px;
  text-align:center;
  box-shadow:var(--shadow-lg);
  transform:scale(.92);
  transition:transform .25s var(--ease);
}
.popup-overlay.show .popup{ transform:scale(1); }

.popup h2{ margin-bottom:20px; font-size:19px; font-weight:700; }

.select-button{
  width:100%;
  padding:14px;
  border:1px solid var(--border);
  border-radius:13px;
  background:var(--surface-2);
  color:var(--text-1);
  font-family:inherit;
  font-size:15px;
  font-weight:700;
  cursor:pointer;
}

.select-menu{
  background:var(--surface-2);
  border-radius:13px;
  overflow:hidden;
  border:1px solid var(--border);
  max-height:0;
  opacity:0;
  margin-top:0;
  transition:max-height .25s ease, opacity .25s ease, margin-top .25s ease;
}
.select-menu.show{ max-height:90px; opacity:1; margin-top:8px; }

.select-menu div{
  padding:10px 14px;
  font-size:14px;
  text-align:left;
  cursor:pointer;
}
.select-menu div:hover{ background:var(--accent-soft); color:var(--text-1); }

.popup-buttons{
  display:flex;
  gap:12px;
  opacity:0;
  max-height:0;
  overflow:hidden;
  pointer-events:none;
  margin-top:0;
  transform:translateY(-8px);
  transition:opacity .25s ease, max-height .25s ease, margin-top .25s ease, transform .25s ease;
}
.popup-buttons:not(.hidden){ opacity:1; max-height:80px; pointer-events:auto; margin-top:18px; transform:translateY(0); }

.popup-buttons button{
  flex:1;
  padding:12px 16px;
  font-size:14.5px;
  font-weight:700;
  font-family:inherit;
  border:none;
  border-radius:13px;
  cursor:pointer;
  transition:transform .2s var(--ease), box-shadow .2s ease, opacity .2s ease;
}
.popup-buttons button:hover{ transform:translateY(-2px); }

.cancel-btn{ background:var(--surface-2); border:1px solid var(--border); color:var(--text-1); }

#downloadPopupBtn{
  background:var(--accent-grad);
  color:#05050b;
  box-shadow:0 8px 20px rgba(127,92,255,.24);
}
#downloadPopupBtn:disabled{ opacity:.4; cursor:not-allowed; transform:none; box-shadow:none; }
</style>

<div id="downloadPopup" class="popup-overlay">
  <div class="popup">
    <h2>Télécharger MoonFlow</h2>

    <div class="custom-select">
      <button id="selectButton" class="select-button" type="button" onclick="toggleSelect()">
        Choisir un système ▼
      </button>
      <div id="selectMenu" class="select-menu">
        <div onclick="chooseOS('windows')">🪟 Windows</div>
        <div onclick="chooseOS('linux')">🐧 Linux</div>
      </div>
    </div>

    <div id="popupButtons" class="popup-buttons hidden">
      <button class="cancel-btn" type="button" onclick="closePopup()">Annuler</button>
      <button id="downloadPopupBtn" type="button" onclick="downloadSelected()" disabled>Download</button>
    </div>
  </div>
</div>

<script src="assets/js/site.js"></script>
<script>
let selectedOS = "";

function openPopup(){
  document.getElementById("downloadPopup").classList.add("show");
}

function closePopup(){
  document.getElementById("downloadPopup").classList.remove("show");
  setTimeout(function(){
    selectedOS = "";
    document.getElementById("selectButton").innerHTML = "Choisir un système ▼";
    document.getElementById("selectMenu").classList.remove("show");
    document.getElementById("popupButtons").classList.add("hidden");
    updateDownloadButton();
  }, 250);
}

document.getElementById("downloadPopup").addEventListener("click", function(e){
  if(e.target === this) closePopup();
});

function toggleSelect(){
  document.getElementById("selectMenu").classList.toggle("show");
}

function chooseOS(os){
  selectedOS = os;
  document.getElementById("selectButton").innerHTML = os === "windows" ? "🪟 Windows ▼" : "🐧 Linux ▼";
  document.getElementById("selectMenu").classList.remove("show");
  document.getElementById("popupButtons").classList.remove("hidden");
  updateDownloadButton();
}

function updateDownloadButton(){
  document.getElementById("downloadPopupBtn").disabled = selectedOS === "";
}

function downloadSelected(){
  if(selectedOS === "windows"){
    window.location.href = "https://github.com/Amethyst-szs/MoonFlow/releases/download/v1.3.5/win-x86_64.zip";
  }
  if(selectedOS === "linux"){
    window.location.href = "https://github.com/Amethyst-szs/MoonFlow/releases/download/v1.3.5/linux-x86_64.zip";
  }
  closePopup();
}
</script>
