<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mes Shorts - Dani_MK</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background: #000;
    font-family: 'Segoe UI', Arial, sans-serif;
    color: white;
}

/* ================= NAVBAR ================= */
.navbar {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    background: rgba(0,0,0,0.9);
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 12px;
    padding: 12px;
    z-index: 1000;
    box-shadow: 0 5px 20px rgba(0,0,0,0.6);
}

.nav-btn {
    padding: 10px 18px;
    border-radius: 18px;
    border: none;
    font-size: 14px;
    font-weight: bold;
    color: white;
    cursor: pointer;
    transition: transform 0.2s, box-shadow 0.2s, background 0.2s;
}

.nav-btn:hover {
    transform: scale(1.08);
    box-shadow: 0 0 15px rgba(255,255,255,0.4);
}

.nav-btn.totk { background: #ff0000; }
.nav-btn.accueil { background: linear-gradient(135deg, #ff0000, #6a00ff); }
.nav-btn.smo { background: #00cc44; }
.nav-btn.botw { background: #0066ff; }
.nav-btn.chatsmo { background: #4c00ff; }

/* ================= CONTENU ================= */
.page {
    min-height: 100vh;
    padding: 140px 15px 60px;
}

h1 {
    text-align: center;
    font-size: 28px;
    margin-bottom: 30px;
    text-shadow: 0 0 15px rgba(255,255,255,0.3);
}

/* ================= GRID SHORTS ================= */
/* MOBILE : 1 colonne */
.grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 22px;
    max-width: 500px;
    margin: 0 auto;
}

iframe {
    width: 100%;
    aspect-ratio: 9 / 16;
    border-radius: 18px;
    border: none;
    box-shadow: 0 0 20px rgba(255,255,255,0.35);
}

/* ================= FOOTER ================= */
footer {
    margin-top: 35px;
    font-size: 13px;
    color: #aaa;
    opacity: 0.8;
    text-align: center;
}

/* ================= TABLET ================= */
@media (min-width: 700px) {
    .grid {
        grid-template-columns: repeat(2, 1fr);
        max-width: 900px;
    }

    h1 {
        font-size: 34px;
    }
}

/* ================= DESKTOP ================= */
@media (min-width: 1100px) {
    .grid {
        grid-template-columns: repeat(4, 1fr);
        max-width: 1400px;
    }

    .nav-btn {
        font-size: 16px;
        padding: 12px 26px;
    }

    h1 {
        font-size: 38px;
    }
}
</style>
</head>

<body>

<!-- NAVBAR -->
