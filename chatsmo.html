<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ChatSmo - Dani_MK</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    font-family:'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #4c00ff, #aa00ff);
    color: white;
    min-height: 100vh;
}

/* ================= NAVBAR ================= */
.navbar {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    min-height: 70px;
    background: rgba(0,0,0,0.85);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 18px;
    padding: 10px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.6);
    z-index: 1000;
    flex-wrap: wrap;
}

.nav-btn {
    padding: 10px 22px;
    border-radius: 20px;
    border: none;
    color: white;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    transition: transform 0.2s, box-shadow 0.2s;
}

.nav-btn.totk { background: #ff0000; }
.nav-btn.smo { background: #00cc44; }
.nav-btn.botw { background: #0066ff; }
.nav-btn.accueil { background: linear-gradient(135deg, #ff0000, #6a00ff); }

.nav-btn:hover {
    transform: scale(1.08);
    box-shadow: 0 0 15px rgba(255,255,255,0.4);
}

/* ================= PAGE ================= */
.page {
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 100px 15px 40px;
    min-height: 100vh;
}

/* ================= CHAT CARD ================= */
.chat-card {
    width: 100%;
    max-width: 850px;
    height: 650px;
    background: rgba(0,0,0,0.88);
    border-radius: 22px;
    display: flex;
    flex-direction: column;
    box-shadow: 0 0 35px rgba(0,0,0,0.7);
    overflow: hidden;
}

/* ================= TABS ================= */
.tabs {
    display:flex;
    gap:10px;
    padding:12px;
    background:rgba(0,0,0,0.65);
}

.tab {
    flex:1;
    text-align:center;
    padding:12px 0;
    border-radius:18px;
    cursor:pointer;
    font-weight:bold;
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.15);
    transition:all 0.25s ease;
}

.tab:hover {
    background: rgba(255,255,255,0.18);
}

.tab.active {
    background:linear-gradient(135deg,#5f00ff,#9b00ff);
    box-shadow:0 0 18px rgba(140,0,255,0.9);
    border:none;
}

/* ================= TAB CONTENT ================= */
.tab-content {
    flex:1;
    display:none;
    flex-direction:column;
}

.tab-content.active {
    display:flex;
}

/* ================= CHAT ================= */
.chat-window {
    flex:1;
    padding:15px;
    overflow-y:auto;
    display:flex;
    flex-direction:column;
    gap:10px;
}

.chat-input {
    display:flex;
    padding:12px;
    border-top:1px solid #333;
    gap:10px;
}

.chat-input input {
    flex:1;
    padding:12px;
    border-radius:10px;
    border:none;
    font-size:15px;
}

.chat-input button {
    padding:0 22px;
    border-radius:10px;
    border:none;
    background:#4c00ff;
    color:white;
    cursor:pointer;
    font-weight:bold;
}

/* ================= MESSAGES ================= */
.message {
    padding:10px 14px;
    border-radius:12px;
    max-width:85%;
    word-wrap: break-word;
}

.user {
    background:#333;
    align-self:flex-end;
}

.ia {
    background:#4c00ff;
    align-self:flex-start;
}

/* ================= JUMPEDIA ================= */
.jumpedia {
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding-top:20px;
    gap:12px;
    font-size:18px;
}

/* ================= BOUTONS FIXES ================= */
.shorts-btn,
.jumps-btn {
    position:fixed;
    bottom:20px;
    padding:14px 24px;
    border-radius:30px;
    border:none;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
    color:white;
    z-index:2000;
}

.shorts-btn {
    left:20px;
    background:linear-gradient(135deg, #2600ff, #00ffc8);
}

.jumps-btn {
    right:20px;
    background:#666;
}

/* ================= MOBILE ================= */
@media (max-width: 768px) {

    .chat-card {
        height: calc(100vh - 140px);
        border-radius: 18px;
    }

    .tab {
        font-size:14px;
        padding:10px 0;
    }

    .chat-input input {
        font-size:14px;
    }

    .chat-input button {
        padding:0 18px;
        font-size:14px;
    }

    .jumpedia {
        font-size:16px;
    }

    .shorts-btn,
    .jumps-btn {
        font-size:14px;
        padding:12px 20px;
    }
}
</style>
</head>

<body>

<!-- Navbar -->
<div class="navbar">
    <button class="nav-btn totk" onclick="goTOTK()">TOTK</button>
    <button class="nav-btn smo" onclick="goSMO()">SMO</button>
    <button class="nav-btn botw" onclick="goBOTW()">BOTW</button>
    <button class="nav-btn accueil" onclick="goAccueil()">Accueil</button>
</div>

<div class="page">
    <div class="chat-card">

        <div class="tabs">
            <div class="tab active" onclick="openTab('chat')">🤖 Chatbot</div>
            <div class="tab" onclick="openTab('jumpedia')">🎬 Jumpedia</div>
        </div>

        <div class="tab-content active" id="chat">
            <div class="chat-window" id="chat-window">
                Tapez un message pour commencer...
            </div>
            <div class="chat-input">
                <input type="text" id="user-input" placeholder="Écrire un message...">
                <button onclick="sendMessage()">Envoyer</button>
            </div>
        </div>

        <div class="tab-content" id="jumpedia">
            <div class="jumpedia" id="jumpedia-container">
                Chargement de Jumpedia...
            </div>
        </div>

    </div>
</div>

<a href="shorts.html"><button class="shorts-btn">Mes Shorts</button></a>
<button class="jumps-btn" onclick="window.location.href='https://danielb2012.github.io/Dani_MK-site/jumps.html'">
    Serveurs Trickjumps
</button>

<script src="commands.js"></script>
<script>
function goTOTK(){ window.location.href="totk.html"; }
function goSMO(){ window.location.href="smo.html"; }
function goBOTW(){ window.location.href="botw.html"; }
function goAccueil(){ window.location.href="index.html"; }

function openTab(id){
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    document.querySelector(`[onclick="openTab('${id}')"]`).classList.add('active');
    document.getElementById(id).classList.add('active');
    if(id === "jumpedia") initJumpedia();
}
</script>

</body>
</html>
