<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>ChatSmo - Dani_MK</title>
<style>
/* Même style que ton code initial */
* { box-sizing: border-box; }
body { margin:0; font-family:'Segoe UI', sans-serif; background: linear-gradient(135deg, #4c00ff, #aa00ff); color:white; min-height:100vh; }
.navbar { position:fixed; top:0; left:0; width:100%; height:70px; background:rgba(0,0,0,0.85); display:flex; align-items:center; justify-content:center; gap:25px; box-shadow:0 5px 20px rgba(0,0,0,0.6); z-index:1000; }
.nav-btn { padding:12px 26px; border-radius:20px; border:none; color:white; font-size:16px; font-weight:bold; cursor:pointer; transition: transform 0.2s, box-shadow 0.2s, background 0.2s; }
.nav-btn.totk { background:#ff0000; } .nav-btn.smo { background:#00cc44; } .nav-btn.botw { background:#0066ff; } .nav-btn.accueil { background: linear-gradient(135deg,#ff0000,#6a00ff); }
.nav-btn:hover { transform: scale(1.1); box-shadow: 0 0 15px rgba(255,255,255,0.4); }
.page { display:flex; flex-direction:column; justify-content:center; align-items:center; padding-top:100px; min-height: calc(100vh-100px);}
.chat-card { width:90%; max-width:800px; height:600px; background: rgba(0,0,0,0.85); border-radius:20px; display:flex; flex-direction:column; box-shadow:0 0 30px rgba(0,0,0,0.6); overflow:hidden; }
.tabs { display:flex; gap:10px; padding:12px; background:rgba(0,0,0,0.6);}
.tab { flex:1; text-align:center; padding:10px 0; border-radius:18px; cursor:pointer; font-weight:bold; background: rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.15); transition:all 0.25s ease;}
.tab:hover { background: rgba(255,255,255,0.15);}
.tab.active { background: linear-gradient(135deg,#5f00ff,#9b00ff); box-shadow:0 0 18px rgba(140,0,255,0.9); border:none; }
.tab-content { flex:1; display:none; flex-direction:column; }
.tab-content.active { display:flex; }
.chat-window { flex:1; padding:15px; overflow-y:auto; display:flex; flex-direction:column; gap:10px;}
.chat-input { display:flex; padding:10px; border-top:1px solid #333; }
.chat-input input { flex:1; padding:10px; border-radius:10px; border:none; }
.chat-input button { margin-left:10px; padding:0 20px; border-radius:10px; border:none; background:#4c00ff; color:white; cursor:pointer;}
.message { padding:8px 12px; border-radius:10px; max-width:80%; }
.user { background:#333; align-self:flex-end; }
.ia { background:#4c00ff; align-self:flex-start; }
.jumpmedia { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-start; opacity:0.9; font-size:20px; padding-top:20px; gap:10px;}
</style>
</head>

<body>
<div class="navbar">
    <button class="nav-btn totk" onclick="goTOTK()">TOTK</button>
    <button class="nav-btn smo" onclick="goSMO()">SMO</button>
    <button class="nav-btn botw" onclick="goBOTW()">BOTW</button>
    <button class="nav-btn accueil" onclick="goAccueil()">Accueil</button>
</div>

<div class="page">
    <div class="chat-card">
        <div class="tabs">
            <div class="tab active" onclick="openTab('chat')">🤖 Chatbot</div>
            <div class="tab" onclick="openTab('jumpmedia')">🎬 Jumpmedia</div>
        </div>

        <!-- Chat -->
        <div class="tab-content active" id="chat">
            <div class="chat-window" id="chat-window">
                Tapez un message pour commencer...
            </div>
            <div class="chat-input">
                <input type="text" id="user-input" placeholder="Écrire un message...">
                <button onclick="sendMessage()">Envoyer</button>
            </div>
        </div>

        <!-- Jumpmedia -->
        <div class="tab-content" id="jumpmedia">
            <div class="jumpmedia" id="jumpmedia-container"></div>
        </div>
    </div>
</div>

<script type="module">
import { runCommandFromHTML } from './commands.js'; // Assurez-vous que commands.js exporte runCommandFromHTML

// Navigation
function goTOTK(){ window.location.href="totk.html"; }
function goSMO(){ window.location.href="smo.html"; }
function goBOTW(){ window.location.href="botw.html"; }
function goAccueil(){ window.location.href="index.html"; }

// Onglets
function openTab(id){
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    document.querySelector(`[onclick="openTab('${id}')"]`).classList.add('active');
    document.getElementById(id).classList.add('active');

    if(id === "jumpmedia") initJumpmedia();
}

// Fonction pour afficher un message dans Jumpmedia
function addJumpmediaMessage(container, text, type){
    const div = document.createElement("div");
    div.className = "message " + type;
    div.innerHTML = text.replace(/\n/g,"<br>");
    container.appendChild(div);
    container.scrollTop = container.scrollHeight;
}

// Initialisation du chat Jumpmedia
function initJumpmedia(){
    const container = document.getElementById("jumpmedia-container");
    container.innerHTML = "";

    const chatWindow = document.createElement("div");
    chatWindow.style.flex = "1";
    chatWindow.style.width = "90%";
    chatWindow.style.height = "300px";
    chatWindow.style.overflowY = "auto";
    chatWindow.style.display = "flex";
    chatWindow.style.flexDirection = "column";
    chatWindow.style.gap = "10px";
    chatWindow.style.marginBottom = "10px";
    chatWindow.style.padding = "10px";
    chatWindow.style.background = "rgba(0,0,0,0.3)";
    chatWindow.style.borderRadius = "10px";
    container.appendChild(chatWindow);

    const inputDiv = document.createElement("div");
    inputDiv.style.display = "flex";
    inputDiv.style.marginTop = "10px";

    const input = document.createElement("input");
    input.type = "text";
    input.placeholder = "Entrez une commande...";
    input.style.flex = "1";
    input.style.padding = "10px";
    input.style.borderRadius = "8px";
    input.style.border = "none";

    const btn = document.createElement("button");
    btn.innerText = "Exécuter";
    btn.style.marginLeft = "10px";
    btn.style.padding = "10px 20px";
    btn.style.borderRadius = "8px";
    btn.style.border = "none";
    btn.style.background = "#4c00ff";
    btn.style.color = "white";
    btn.style.cursor = "pointer";

    inputDiv.appendChild(input);
    inputDiv.appendChild(btn);
    container.appendChild(inputDiv);

    btn.onclick = async ()=>{
        const command = input.value.trim();
        if(!command) return;
        addJumpmediaMessage(chatWindow, command, "user");
        const result = await runCommandFromHTML(command,"User");
        addJumpmediaMessage(chatWindow, result, "ia");
        input.value = "";
    };

    // Permet d'envoyer avec Enter
    input.addEventListener("keypress", async (e)=>{
        if(e.key === "Enter"){
            btn.click();
        }
    });
}
</script>

</body>
</html>
