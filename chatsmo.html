<style>
body{
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
}

/* ===== APP CARD ===== */
.app{
  width:min(880px, 94vw);
  height:min(660px, 82vh);
  background:var(--bg-1);
  border:1px solid var(--border);
  border-radius:var(--radius-xl);
  box-shadow:var(--shadow-lg), 0 0 0 1px rgba(127,92,255,.12), 0 0 90px rgba(127,92,255,.07);
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

.app-header{
  padding:16px 22px;
  font-weight:700;
  font-size:19px;
  background:var(--surface);
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:space-between;
  flex-shrink:0;
}
.app-header-title{
  font-family:var(--font-display);
  background:var(--accent-grad);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

/* ===== CHAT ===== */
.chat{
  flex:1;
  padding:20px 18px;
  overflow-y:auto;
  display:flex;
  flex-direction:column;
  gap:10px;
  background:
    radial-gradient(circle at 15% 15%, rgba(127,92,255,.05), transparent 55%),
    radial-gradient(circle at 85% 85%, rgba(0,255,213,.04), transparent 55%);
}

.bubble{
  max-width:70%;
  padding:11px 15px;
  border-radius:18px;
  font-size:14px;
  line-height:1.48;
  animation:bubble-pop .2s cubic-bezier(.2,.9,.2,1);
}

.user{
  align-self:flex-end;
  background:linear-gradient(135deg, var(--accent), #a07aff);
  color:#fff;
  border-bottom-right-radius:5px;
  box-shadow:0 4px 18px rgba(127,92,255,.3);
}

.bot{
  align-self:flex-start;
  background:var(--surface);
  border:1px solid var(--border);
  color:var(--text-1);
  border-bottom-left-radius:5px;
  box-shadow:0 2px 10px rgba(0,0,0,.2);
}

@keyframes bubble-pop{
  from{ transform:scale(.92) translateY(5px); opacity:0; }
  to{ transform:scale(1) translateY(0); opacity:1; }
}

/* ===== INPUT BAR ===== */
.input-bar{
  padding:13px 16px;
  display:flex;
  gap:10px;
  background:var(--surface);
  border-top:1px solid var(--border);
  align-items:center;
  flex-shrink:0;
}

.input-bar input{
  flex:1;
  padding:12px 18px;
  border-radius:14px;
  border:1px solid var(--border);
  outline:none;
  font-size:14px;
  background:var(--surface-2);
  color:var(--text-1);
  font-family:inherit;
  transition:border-color .2s ease, background-color .2s ease;
}
.input-bar input:focus{ border-color:rgba(127,92,255,.5); background:var(--surface-3); }
.input-bar input::placeholder{ color:var(--text-3); }

.send-btn{
  padding:12px 22px;
  border-radius:14px;
  border:none;
  cursor:pointer;
  font-weight:700;
  font-size:14px;
  font-family:inherit;
  background:var(--accent-grad);
  color:#05050b;
  transition:transform .15s ease, box-shadow .15s ease;
  white-space:nowrap;
  box-shadow:0 4px 20px rgba(127,92,255,.32);
}
.send-btn:hover{ transform:scale(1.05); box-shadow:0 6px 28px rgba(127,92,255,.5); }
.send-btn:active{ transform:scale(.97); }

/* ===== BOUTON INFO + POPUP ===== */
.info-wrap{ position:relative; display:flex; align-items:center; }

.info-badge{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  width:32px; height:32px;
  border-radius:50%;
  border:1.5px solid var(--border-strong);
  background:var(--surface-2);
  color:var(--text-2);
  font-weight:800;
  font-style:italic;
  cursor:pointer;
  font-size:13px;
  transition:all .18s ease;
}
.info-badge:hover{ background:var(--accent-soft); border-color:rgba(127,92,255,.5); color:var(--text-1); transform:scale(1.1); }

.info-popup{
  position:absolute;
  top:calc(100% + 12px);
  right:0;
  min-width:220px;
  max-width:320px;
  background:linear-gradient(180deg, rgba(255,255,255,.98), rgba(250,250,250,.97));
  color:#050509;
  padding:12px 14px;
  border-radius:12px;
  box-shadow:0 18px 40px rgba(4,6,12,.55);
  border:1px solid rgba(0,0,0,.06);
  transform:scale(.88);
  transform-origin:top right;
  opacity:0;
  pointer-events:none;
  transition:transform .26s cubic-bezier(.2,.9,.2,1), opacity .18s ease;
  z-index:40;
  overflow:hidden;
  backdrop-filter:blur(6px) saturate(120%);
}
.info-popup.show{ transform:scale(1); opacity:1; pointer-events:auto; }

.info-popup .row{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:8px; }
.info-popup .title{ font-weight:800; font-size:13px; color:#050509; }
.info-popup .close{ background:transparent; border:none; font-weight:800; font-size:13px; color:rgba(5,5,9,.8); cursor:pointer; padding:6px; border-radius:8px; transition:background .12s ease, transform .12s ease; }
.info-popup .close:hover{ background:rgba(0,0,0,.05); transform:scale(1.05); }
.info-popup .content{ font-size:13px; line-height:1.35; color:#090909; white-space:normal; }

/* ===== RESPONSIVE ===== */
@media(max-width:800px){
  body{ align-items:flex-start; padding-top:82px; }
  .app{ width:100%; height:calc(100vh - 82px); height:calc(100dvh - 82px); border-radius:0; min-height:0; }
}
</style>
</head>

<body>

<div class="app">
  <div class="app-header">
    <span class="app-header-title">Jumpedia</span>
    <div class="info-wrap">
      <div id="infoBadge" class="info-badge" aria-expanded="false" role="button" title="Infos">i</div>
      <div id="infoPopup" class="info-popup" role="dialog" aria-hidden="true">
        <div class="row">
          <div class="title">⚠️</div>
          <button class="close" id="infoClose" aria-label="Fermer">✕</button>
        </div>
        <div class="content" id="infoContent">
          Version non-officielle, commandes comme "!give" impossibles
        </div>
      </div>
    </div>
  </div>

  <div class="chat" id="chat">
    <div class="bubble bot">
      👋 Tape une commande (ex: <b>!info jump</b>, <b>!random</b>, <b>!list</b>)
    </div>
  </div>

  <div class="input-bar">
    <input id="input" placeholder="Tapez une commande commençant par !">
    <button class="send-btn" id="send">Envoyer</button>
  </div>
</div>

<button class="theme-toggle-fab" id="themeToggleFab" aria-label="Changer de thème" title="Changer de thème">

<script src="Jumps-database/jump_data.js"></script>

<script src="commands.js"></script>
<script src="assets/js/site.js"></script>
<script>
const chat = document.getElementById("chat");
const input = document.getElementById("input");

function addBubble(text, type){
  const b = document.createElement("div");
  b.className = "bubble " + type;
  b.innerHTML = text.replace(/\n/g, "<br>");
  chat.appendChild(b);
  chat.scrollTop = chat.scrollHeight;
}

function send(){
  const val = input.value.trim();
  if(!val) return;

  addBubble(val, "user");

  if(typeof runCommand !== "function"){
    addBubble("❌ commands.js non chargé", "bot");
    return;
  }

  runCommand(val, res => {
    addBubble(res, "bot");
    const link = res.match(/https?:\/\/[^\s]+/);
    if(link) window.open(link[0], "_blank");
  });

  input.value = "";
}

document.getElementById("send").onclick = send;
input.addEventListener("keydown", e => { if(e.key === "Enter") send(); });

/* ===== INFO POPUP ===== */
const infoBadge = document.getElementById('infoBadge');
const infoPopup = document.getElementById('infoPopup');
const infoClose = document.getElementById('infoClose');

infoBadge.addEventListener('click', () => {
  const showing = infoPopup.classList.toggle('show');
  infoPopup.setAttribute('aria-hidden', !showing);
  infoBadge.setAttribute('aria-expanded', showing);
});

infoClose.addEventListener('click', () => {
  infoPopup.classList.remove('show');
  infoPopup.setAttribute('aria-hidden', 'true');
  infoBadge.setAttribute('aria-expanded', 'false');
});

document.addEventListener('click', (e) => {
  if(!infoBadge.contains(e.target) && !infoPopup.contains(e.target)){
    if(infoPopup.classList.contains('show')){
      infoPopup.classList.remove('show');
      infoPopup.setAttribute('aria-hidden', 'true');
      infoBadge.setAttribute('aria-expanded', 'false');
    }
  }
});

document.addEventListener('keydown', (e) => {
  if(e.key === 'Escape' && infoPopup.classList.contains('show')){
    infoPopup.classList.remove('show');
    infoPopup.setAttribute('aria-hidden', 'true');
    infoBadge.setAttribute('aria-expanded', 'false');
  }
});
</script>
