<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>ChatSmo - Dani_MK</title>
<style>
* { box-sizing: border-box; }
body {
    margin: 0;
    font-family:'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #4c00ff, #aa00ff);
    color: white;
    min-height: 100vh;
}
.navbar {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 70px;
    background: rgba(0,0,0,0.85);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 25px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.6);
    z-index: 1000;
}
.nav-btn {
    padding: 12px 26px;
    border-radius: 20px;
    border: none;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    transition: transform 0.2s, box-shadow 0.2s, background 0.2s;
}
.nav-btn:hover { transform: scale(1.1); box-shadow: 0 0 15px rgba(255,255,255,0.4); }

.page { display:flex; flex-direction:column; justify-content:center; align-items:center; padding-top:100px; min-height:calc(100vh-100px);}
.chat-card { width:90%; max-width:800px; height:600px; background:rgba(0,0,0,0.85); border-radius:20px; display:flex; flex-direction:column; overflow:hidden;}
.tabs { display:flex; gap:10px; padding:12px; background:rgba(0,0,0,0.6);}
.tab { flex:1; text-align:center; padding:10px 0; border-radius:18px; cursor:pointer; font-weight:bold; background:rgba(255,255,255,0.08);}
.tab.active { background:linear-gradient(135deg,#5f00ff,#9b00ff);}
.tab-content { flex:1; display:none; flex-direction:column; }
.tab-content.active { display:flex; }
.chat-window { flex:1; padding:15px; overflow-y:auto; display:flex; flex-direction:column; gap:10px;}
.chat-input { display:flex; padding:10px; border-top:1px solid #333;}
.chat-input input { flex:1; padding:10px; border-radius:10px; border:none;}
.chat-input button { margin-left:10px; padding:0 20px; border-radius:10px; border:none; background:#4c00ff; color:white; cursor:pointer;}
.message { padding:8px 12px; border-radius:10px; max-width:80%;}
.user { background:#333; align-self:flex-end; }
.ia { background:#4c00ff; align-self:flex-start; }
.jumpmedia { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-start; opacity:0.95; font-size:20px; padding-top:20px; gap:10px;}
</style>
</head>

<body>
<div class="navbar">
    <button class="nav-btn" onclick="goAccueil()">Accueil</button>
</div>

<div class="page">
    <div class="chat-card">
        <div class="tabs">
            <div class="tab active" onclick="openTab('chat')">🤖 Chatbot</div>
            <div class="tab" onclick="openTab('jumpmedia')">🎬 Jumpmedia</div>
        </div>

        <div class="tab-content active" id="chat">
            <div class="chat-window" id="chat-window">Tapez un message pour commencer...</div>
            <div class="chat-input">
                <input type="text" id="user-input" placeholder="Écrire un message...">
                <button onclick="sendMessage()">Envoyer</button>
            </div>
        </div>

        <div class="tab-content" id="jumpmedia">
            <div class="jumpmedia" id="jumpmedia-container">Chargement de Jumpmedia...</div>
        </div>
    </div>
</div>

<script src="commands.js"></script>

<script>
function goAccueil(){ window.location.href="index.html"; }

function openTab(id){
    document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c=>c.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    document.querySelector(`.tab[onclick="openTab('${id}')"]`).classList.add('active');
    if(id==="jumpmedia") initJumpmedia();
}

function addMessage(text,type){
    const chatWindow = document.getElementById("chat-window");
    const div = document.createElement("div");
    div.className = "message "+type;
    div.innerHTML=text.replace(/\n/g,"<br>");
    chatWindow.appendChild(div);
    chatWindow.scrollTop=chatWindow.scrollHeight;
}

async function sendMessage(){
    const input=document.getElementById("user-input");
    const msg=input.value.trim();
    if(!msg) return;
    addMessage(msg,"user");
    input.value="";
    runCommand(msg,res=>{
        addMessage(res,"ia");
        // Si c'est !list ou !missing, ouvrir le paste.ee automatiquement
        if(msg.toLowerCase().startsWith("!list") || msg.toLowerCase().startsWith("!missing")){
            const urlMatch=res.match(/https?:\/\/paste\.ee\/[^\s"]+/);
            if(urlMatch) window.open(urlMatch[0],"_blank");
        }
    });
}

// --------- Jumpmedia ---------
function initJumpmedia(){
    const container=document.getElementById("jumpmedia-container");
    container.innerHTML="";
    if(typeof runCommand!=="function"){ container.innerHTML="Erreur: commands.js non chargé ou runCommand non défini."; return; }

    const title=document.createElement("div");
    title.innerText="Jumpmedia prêt 🚀 Tapez une commande ci-dessous:";
    container.appendChild(title);

    const input=document.createElement("input");
    input.type="text";
    input.placeholder="Entrez une commande...";
    input.style.padding="8px"; input.style.borderRadius="8px"; input.style.border="none"; input.style.width="60%";
    container.appendChild(input);

    const btn=document.createElement("button");
    btn.innerText="Exécuter"; btn.style.marginLeft="10px"; btn.style.padding="8px 15px";
    btn.style.borderRadius="8px"; btn.style.border="none"; btn.style.background="#4c00ff"; btn.style.color="white"; btn.style.cursor="pointer";
    container.appendChild(btn);

    const output=document.createElement("div"); output.style.marginTop="15px"; container.appendChild(output);

    btn.onclick=()=>{
        const cmd=input.value.trim();
        if(!cmd) return;
        runCommand(cmd,res=>{
            const p=document.createElement("div");
            p.innerHTML=`<strong>Résultat:</strong> ${res.replace(/\n/g,"<br>")}`;
            output.appendChild(p);
            output.scrollTop=output.scrollHeight;
            // Ouverture automatique pour paste.ee
            if(cmd.toLowerCase().startsWith("!list") || cmd.toLowerCase().startsWith("!missing")){
                const urlMatch=res.match(/https?:\/\/paste\.ee\/[^\s"]+/);
                if(urlMatch) window.open(urlMatch[0],"_blank");
            }
            input.value="";
        });
    };
}
</script>
</body>
</html>
