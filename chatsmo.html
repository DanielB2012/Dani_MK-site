<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jumpedia</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  height:100vh;
  background:
    radial-gradient(600px 400px at 10% 10%, rgba(127,92,255,.15), transparent),
    radial-gradient(600px 400px at 90% 90%, rgba(0,255,213,.12), transparent),
    linear-gradient(180deg,#050509,#0b0b16);
  font-family:"Segoe UI",system-ui,sans-serif;
  display:flex;
  justify-content:center;
  align-items:center;
  color:#fff;
}

.app{
  width:min(900px,95vw);
  height:min(700px,92vh);
  background:rgba(10,10,20,.9);
  border-radius:24px;
  box-shadow:0 40px 120px rgba(0,0,0,.6);
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

.header{
  padding:16px 22px;
  font-weight:900;
  font-size:22px;
  background:linear-gradient(90deg,#7f5cff,#00ffd5);
  color:#050509;
}

.chat{
  flex:1;
  padding:18px;
  overflow-y:auto;
  display:flex;
  flex-direction:column;
  gap:12px;
}

.bubble{
  max-width:72%;
  padding:10px 14px;
  border-radius:18px;
  font-size:14.5px;
  line-height:1.45;
}

.user{
  align-self:flex-end;
  background:linear-gradient(135deg,#7f5cff,#b28cff);
  color:#050509;
  border-bottom-right-radius:6px;
}

.bot{
  align-self:flex-start;
  background:linear-gradient(135deg,#00ffd5,#7fffe9);
  color:#050509;
  border-bottom-left-radius:6px;
}

/* liens cliquables */
.bubble a{
  color:#0044ff;
  font-weight:700;
  text-decoration:underline;
}
.bubble a:hover{opacity:.8}

.input-bar{
  padding:14px;
  display:flex;
  gap:10px;
  background:rgba(0,0,0,.55);
}

.input-bar input{
  flex:1;
  padding:12px 16px;
  border-radius:16px;
  border:none;
  outline:none;
  font-size:15px;
}

.send-btn{
  padding:12px 22px;
  border-radius:16px;
  border:none;
  cursor:pointer;
  font-weight:900;
  background:linear-gradient(90deg,#7f5cff,#00ffd5);
  color:#050509;
}
.send-btn:hover{transform:scale(1.05)}
</style>
</head>

<body>

<div class="app">
  <div class="header">Jumpedia</div>

  <div class="chat" id="chat">
    <div class="bubble bot">
      👋 Tape une commande (ex: <b>!info jump</b>, <b>!random</b>, <b>!list</b>)
    </div>
  </div>

  <div class="input-bar">
    <input id="input" placeholder="Tapez une commande commençant par !">
    <button class="send-btn" id="send">Envoyer</button>
  </div>
</div>

<script src="commands.js"></script>

<script>
const chat = document.getElementById("chat");
const input = document.getElementById("input");

/* transforme les liens en <a> cliquables */
function formatText(text){
  return text
    .replace(/(https?:\/\/[^\s]+)/g,
      '<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>')
    .replace(/\n/g,"<br>");
}

function addBubble(text,type){
  const b=document.createElement("div");
  b.className="bubble "+type;
  b.innerHTML=formatText(text);
  chat.appendChild(b);
  chat.scrollTop=chat.scrollHeight;
}

async function send(){
  const val=input.value.trim();
  if(!val) return;

  addBubble(val,"user");

  if(typeof runCommand!=="function"){
    addBubble("❌ commands.js non chargé","bot");
    return;
  }

  runCommand(val,res=>{
    addBubble(res,"bot");
  });

  input.value="";
}

document.getElementById("send").onclick=send;
input.addEventListener("keydown",e=>{
  if(e.key==="Enter") send();
});
</script>

</body>
</html>
