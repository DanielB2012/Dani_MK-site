<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Serveurs Trickjumps - Dani_MK</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background: linear-gradient(135deg, #666, #444);
    font-family: 'Segoe UI', Arial, sans-serif;
    color: white;
}

/* ================= NAVBAR ================= */
.navbar {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    background: rgba(0,0,0,0.9);
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 12px;
    padding: 12px;
    z-index: 1000;
    box-shadow: 0 5px 20px rgba(0,0,0,0.6);
}

.nav-btn {
    padding: 10px 18px;
    border-radius: 18px;
    border: none;
    font-size: 14px;
    font-weight: bold;
    color: white;
    cursor: pointer;
    transition: transform 0.2s, box-shadow 0.2s, background 0.2s;
}

.nav-btn:hover {
    transform: scale(1.08);
    box-shadow: 0 0 15px rgba(255,255,255,0.4);
}

.nav-btn.totk { background: #ff0000; }
.nav-btn.smo { background: #00cc44; }
.nav-btn.botw { background: #0066ff; }
.nav-btn.accueil { background: linear-gradient(135deg, #ff0000, #6a00ff); }
.nav-btn.chatsmo { background: #4c00ff; }

/* ================= BOUTON SHORTS ================= */
.shorts-btn {
    position: fixed;
    bottom: 15px;
    left: 15px;
    padding: 14px 22px;
    border-radius: 30px;
    border: none;
    background: linear-gradient(135deg, #2600ff, #00ffc8);
    color: white;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
    z-index: 2000;
    transition: transform 0.2s, box-shadow 0.2s;
}

.shorts-btn:hover {
    transform: scale(1.1);
    box-shadow: 0 0 25px rgba(0,255,200,0.7);
}

/* ================= CONTENU ================= */
.page {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 140px 15px 80px;
}

.card {
    background: rgba(0,0,0,0.88);
    border-radius: 24px;
    padding: 30px 22px;
    width: 100%;
    max-width: 500px;
    text-align: center;
    box-shadow: 0 0 45px rgba(0,0,0,0.9);
}

h1 {
    font-size: 28px;
    margin-bottom: 10px;
    text-shadow: 0 0 15px rgba(255,255,255,0.3);
}

.subtitle {
    font-size: 14px;
    color: #ccc;
    margin-bottom: 30px;
}

/* ================= DISCORD BUTTONS ================= */
.discord-btn {
    width: 100%;
    padding: 18px;
    font-size: 18px;
    border: none;
    border-radius: 16px;
    cursor: pointer;
    font-weight: bold;
    margin-bottom: 18px;
    background: linear-gradient(135deg, #7289da, #5b6eae);
    color: white;
    transition: transform 0.2s, box-shadow 0.2s;
}

.discord-btn:hover {
    transform: scale(1.05);
    box-shadow: 0 0 25px rgba(255,255,255,0.35);
}

footer {
    margin-top: 25px;
    font-size: 13px;
    color: #aaa;
    opacity: 0.8;
}

/* ================= DESKTOP ================= */
@media (min-width: 900px) {

    .nav-btn {
        font-size: 16px;
        padding: 12px 26px;
    }

    h1 {
        font-size: 36px;
    }

    .subtitle {
        font-size: 16px;
    }

    .discord-btn {
        font-size: 22px;
        padding: 22px;
    }

    .shorts-btn {
        font-size: 16px;
        padding: 16px 30px;
    }
}
</style>
</head>

<body>

<!-- NAVBAR -->
<div class="navbar">
    <button class="nav-btn totk" onclick="goTOTK()">TOTK</button>
    <button class="nav-btn smo" onclick="goSMO()">SMO</button>
    <button class="nav-btn botw" onclick="goBOTW()">BOTW</button>
    <button class="nav-btn accueil" onclick="goAccueil()">Accueil</button>
    <button class="nav-btn chatsmo" onclick="goChatSMO()">Chatsmo</button>
</div>

<!-- BOUTON SHORTS -->
<a href="shorts.html">
    <button class="shorts-btn">Mes Shorts</button>
</a>

<!-- CONTENU -->
<div class="page">
    <div class="card">
        <h1>Serveurs Trickjumps</h1>
        <div class="subtitle">Choisissez un serveur à rejoindre :</div>

        <button class="discord-btn"
            onclick="window.open('https://discord.gg/KnTCgTHjWG','_blank')">
            Serveur « smo database »
        </button>

        <button class="discord-btn"
            onclick="window.open('https://discord.gg/smo-trickjumping-469869605570084886','_blank')">
            Serveur « smo trickjumping »
        </button>

        <footer>© 2026 • Dani_MK</footer>
    </div>
</div>

<script>
function goTOTK() { location.href = "totk.html"; }
function goSMO() { location.href = "smo.html"; }
function goBOTW() { location.href = "botw.html"; }
function goAccueil() { location.href = "index.html"; }
function goChatSMO() { location.href = "chatsmo.html"; }
</script>

</body>
</html>
