/* ================= NAVBAR ================= */
.navbar {

    color: white;

}

/* ================= BOUTONS FIXES ================= */
.jumps-btn,

    width: 100%;

    text-align: center;
    box-shadow: 0 0 45px rgba(0,0,0,0.9);

h1 {
