<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BOTW Downloads — Dani_MK</title>

<style>
:root{
  --bg:#07070c;
  --glass:rgba(255,255,255,0.06);
  --border:rgba(255,255,255,0.08);
  --accent1:#7f5cff;
  --accent2:#00ffd5;
  --text:#f5f7fa;
  --muted:#b8bfd4;
}

*{box-sizing:border-box;margin:0;padding:0;}

body{
  font-family:system-ui,Segoe UI,Arial,sans-serif;
  background:
    radial-gradient(600px 400px at 10% 10%, rgba(127,92,255,.15), transparent),
    radial-gradient(600px 400px at 90% 90%, rgba(0,255,213,.12), transparent),
    linear-gradient(180deg,#050509,#0b0b16);
  color:var(--text);
  min-height:100vh;
}

/* ===== CONTAINER ===== */
.container{
  max-width:1200px; /* avant: 900px */
  margin:auto;
  padding:40px 30px;
}

/* ===== CARD ===== */
.card{
  background:var(--glass);
  border:1px solid var(--border);
  border-radius:26px;
  padding:60px 50px; /* augmenté pour plus de volume */
  backdrop-filter:blur(14px);
  box-shadow:0 20px 60px rgba(0,0,0,.6);
  text-align:center;
  max-width:700px; /* plus large que la version précédente */
  margin:auto;
}


.card h1{
  font-size:36px;
}

.card h1 span{
  background:linear-gradient(90deg,var(--accent1),var(--accent2));
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

.subtitle{
  margin-top:10px;
  color:var(--muted);
  margin-bottom:40px;
}

/* ===== DOWNLOAD BUTTONS ===== */
.downloads{
  display:flex;
  flex-direction:column;
  gap:18px;
}

.download-btn{
  padding:20px;
  font-size:18px;
  font-weight:700;
  border:none;
  border-radius:18px;
  cursor:pointer;
  background:linear-gradient(90deg,var(--accent1),var(--accent2));
  color:#050509;
  transition:transform .2s, box-shadow .2s;
  box-shadow:0 10px 30px rgba(0,0,0,.4);
}

.download-btn:hover{
  transform:scale(1.06);
  box-shadow:0 18px 50px rgba(0,0,0,.6);
}

.download-btn.ghost{
  background:var(--glass);
  color:var(--text);
  border:1px solid var(--border);
}

.download-btn.ghost:hover{
  background:rgba(255,255,255,0.1);
}

/* ===== FOOTER ===== */
footer{
  margin-top:40px;
  font-size:13px;
  color:var(--muted);
}

/* ===== BOTTOM NAV ===== */
.bottom-nav{
  position:fixed;
  bottom:18px;
  left:50%;
  transform:translateX(-50%);
  display:flex;
  gap:10px;
  padding:10px;
  background:rgba(0,0,0,.6);
  border:1px solid var(--border);
  border-radius:999px;
  backdrop-filter:blur(10px);
  z-index:1000;
}

.bottom-nav button{
  padding:10px 16px;
  border-radius:14px;
  border:none;
  background:transparent;
  color:var(--muted);
  font-weight:700;
  cursor:pointer;
  transition:transform 0.2s ease, background 0.2s ease;
}

.bottom-nav button:hover{
  transform:scale(1.08);
  background:linear-gradient(90deg,var(--accent1),var(--accent2));
  color:#050509;
}

/* ===== RESPONSIVE ===== */
@media(max-width:600px){
  .card{
    padding:30px 20px;
  }
  .card h1{
    font-size:30px;
  }
}
</style>
</head>

<body>

<div class="container">

  <div class="card">
    <h1>BOTW <span>Downloads</span></h1>
    <div class="subtitle">Télécharge les fichiers Breath of the Wild</div>

    <div class="downloads">
      <button class="download-btn"
        onclick="openLink('https://gamebanana.com/dl/1399535')">
        Télécharger • Ultra Cam
      </button>

      <button class="download-btn"
        onclick="openLink('https://github.com/MaxLastBreath/nx-optimizer/archive/refs/heads/main.zip')">
        Télécharger • NXOptimizer
      </button>

      <button class="download-btn ghost"
        onclick="alert('Pas encore disponible')">
        Télécharger • Fichier à venir
      </button>
    </div>

    <footer>
      © 2026 — Dani_MK
    </footer>
  </div>

</div>

<nav class="bottom-nav">
  <button onclick="go('index.html')">Accueil</button>
  <button onclick="go('totk.html')">TOTK</button>
  <button onclick="go('smo.html')">SMO</button>
  <button onclick="go('chatsmo.html')">ChatSmo</button>
</nav>

<script>
function openLink(url){
  window.open(url,'_blank');
}
function go(page){
  window.location.href = page;
}
</script>

</body>
</html>
