<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Jump List</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #0f0f0f;
            color: #fff;
            padding: 20px;
        }
        h1 {
            margin-bottom: 15px;
        }
        ul {
            columns: 3;
            -webkit-columns: 3;
            -moz-columns: 3;
        }
        li {
            margin-bottom: 5px;
        }
    </style>
</head>
<body>

<h1>Jump List</h1>
<ul id="list"></ul>

<script>
    const data = localStorage.getItem("jump_list");
    if (!data) {
        document.getElementById("list").innerHTML = "<li>No data.</li>";
    } else {
        const list = JSON.parse(data);
        const ul = document.getElementById("list");

        list.forEach(name => {
            const li = document.createElement("li");
            li.textContent = name;
            ul.appendChild(li);
        });
    }
</script>

</body>
</html>
