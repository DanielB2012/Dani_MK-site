<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dani_MK</title>

<style>

.section-title{
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.section-link{
  font-size:14px;
  font-weight:500;
  color:var(--muted);
  cursor:pointer;
  text-decoration:none;
  transition:color .2s ease;
}

.section-link:hover{
  text-decoration:underline;
  color:var(--text);
}


:root{
  --bg:#07070c;
  --glass:rgba(255,255,255,0.06);
  --border:rgba(255,255,255,0.08);
  --accent1:#7f5cff;
  --accent2:#00ffd5;
  --text:#f5f7fa;
  --muted:#b8bfd4;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:system-ui,Segoe UI,Arial,sans-serif;
  background:
    radial-gradient(600px 400px at 10% 10%, rgba(127,92,255,.15), transparent),
    radial-gradient(600px 400px at 90% 90%, rgba(0,255,213,.12), transparent),
    linear-gradient(180deg,#050509,#0b0b16);
  color:var(--text);
  min-height:100vh;
}

/* ===== CONTAINER ===== */
.container{
  max-width:1200px;
  margin:auto;
  padding:30px;
}

/* ===== HERO ===== */
.hero{
  display:flex;
  gap:30px;
  align-items:center;
  background:var(--glass);
  border:1px solid var(--border);
  border-radius:24px;
  padding:30px;
  backdrop-filter:blur(14px);
  box-shadow:0 20px 60px rgba(0,0,0,.6);
}

.avatar{
  width:150px;
  height:150px;
  border-radius:20px;
  overflow:hidden;
  flex-shrink:0;
}

.avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.hero h1{
  font-size:42px;
}

.hero span{
  background:linear-gradient(90deg,var(--accent1),var(--accent2));
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

.hero p{
  margin-top:10px;
  color:var(--muted);
}

.hero-actions{
  margin-top:20px;
  display:flex;
  gap:12px;
  flex-wrap:wrap;
}

/* ===== BUTTONS (SEULE PARTIE MODIFIÉE) ===== */
.btn{
  padding:12px 20px;
  border-radius:14px;
  border:none;
  cursor:pointer;
  font-weight:700;
  font-size:14px;
  transition:
    transform 0.2s ease,
    box-shadow 0.2s ease,
    background 0.2s ease;
}

.btn:hover{
  transform:scale(1.08);
}

.btn:active{
  transform:scale(0.96);
}

.btn-primary{
  background:linear-gradient(90deg,var(--accent1),var(--accent2));
  color:#050509;
  box-shadow:0 8px 24px rgba(0,0,0,.4);
}

.btn-primary:hover{
  box-shadow:0 14px 40px rgba(0,0,0,.6);
}

.btn-ghost{
  background:var(--glass);
  color:var(--text);
  border:1px solid var(--border);
}

.btn-ghost:hover{
  background:rgba(255,255,255,0.1);
}

/* ===== SECTIONS ===== */
.section{
  margin-top:40px;
}

.section h2{
  font-size:24px;
  margin-bottom:18px;
}

/* ===== SHORTS GRID ===== */
.shorts-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:22px;
}

.short-card{
  background:var(--glass);
  border:1px solid var(--border);
  border-radius:22px;
  padding:14px;
  backdrop-filter:blur(10px);
  transition:transform .25s, box-shadow .25s;
}

.short-card:hover{
  transform:translateY(-10px);
  box-shadow:0 30px 80px rgba(0,0,0,.7);
}

.short-embed{
  width:100%;
  aspect-ratio:9/16;
  border-radius:16px;
  overflow:hidden;
  background:#000;
}

.short-embed iframe{
  width:100%;
  height:100%;
  border:none;
}

.short-card h3{
  margin-top:12px;
  font-size:15px;
  color:var(--muted);
  text-align:center;
}

/* ===== BOTTOM NAV ===== */
.bottom-nav{
  position:fixed;
  bottom:18px;
  left:50%;
  transform:translateX(-50%);
  display:flex;
  gap:10px;
  padding:10px;
  background:rgba(0,0,0,.6);
  border:1px solid var(--border);
  border-radius:999px;
  backdrop-filter:blur(10px);
  z-index:1000;
}

.bottom-nav button{
  padding:10px 16px;
  border-radius:14px;
  border:none;
  background:transparent;
  color:var(--muted);
  font-weight:700;
  cursor:pointer;
  transition:transform 0.2s ease, background 0.2s ease;
}

.bottom-nav button:hover{
  transform:scale(1.08);
  background:linear-gradient(90deg,var(--accent1),var(--accent2));
  color:#050509;
}

/* ===== FOOTER ===== */
footer{
  margin-top:60px;
  text-align:center;
  color:var(--muted);
  font-size:13px;
}

/* ===== RESPONSIVE ===== */
@media(max-width:800px){
  .hero{
    flex-direction:column;
    text-align:center;
  }
}

/* ===== LEFT BUTTONS ===== */
.left-buttons{
  position:fixed;
  left:18px;
  top:50%;
  transform:translateY(-50%);
  display:flex;
  flex-direction:column;
  gap:10px;
  z-index:1000;
}

.left-buttons .btn{
  padding:10px 16px;
  font-size:13px;
  white-space:nowrap;
}

/* ===== HERO-RIGHT BUTTONS ===== */
.hero-right{
  display:flex;
  flex-direction:column;
  gap:10px; /* un peu moins d’espace entre les boutons */
  margin-left:auto; /* pousse à droite */
}

/* style des boutons */
.hero-right .btn{
  position:relative;
  overflow:hidden;
  background:var(--glass);
  border:1px solid rgba(255,255,255,0.08);
  border-radius:16px;       /* légèrement plus petit que 14px */
  padding:14px 20px;         /* moins de padding pour bouton plus compact */
  font-size:13px;            /* un peu plus petit */
  cursor:pointer;
  font-weight:700;
  
  /* transitions pour hover et scale doux */
  transition: transform 0.25s ease, box-shadow 0.25s ease;
}

/* hover doux avec glow vert et scale */
.hero-right .btn:hover{
  transform: scale(1.08);
  box-shadow:0 6px 20px rgba(0,255,213,0.35); /* glow vert */
}

/* REFLET BLANC GLISSANT */
.hero-right .btn::after{
  content:"";
  position:absolute;
  top:-150%;
  left:-70%;
  width:50%;
  height:350%;
  background:linear-gradient(
    120deg,
    transparent,
    rgba(255,255,255,0.45),
    transparent
  );
  transform:rotate(20deg);
  transition:all .6s ease;
  pointer-events:none;
}

.hero-right .btn:hover::after{
  left:140%;
}

/* focus accessible */
.hero-right .btn:focus-visible{
  outline:none;
  box-shadow:
    0 0 0 2px var(--accent2),
    0 0 16px rgba(0,255,213,0.4);
}


</style>
</head>
