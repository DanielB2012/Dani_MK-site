<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dani_MK - Créateur YouTube</title>

<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">

<style>
* { box-sizing: border-box; }

html, body {
    margin: 0;
    font-family: 'Roboto', Arial, sans-serif;
    color: white;
    background: linear-gradient(135deg, #ff0000, #6a00ff);
    background-attachment: fixed;
}

/* ================= NAVBAR ================= */
.navbar {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 70px;
    background: rgba(0,0,0,0.9);
    display: flex;
    align-items: center;
    padding-left: 15px;
    z-index: 1000;
    box-shadow: 0 5px 20px rgba(0,0,0,0.6);
}

/* Hamburger container */
.menu-btn {
    width: 30px;
    height: 22px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    cursor: pointer;
    transition: transform 0.3s ease;
}

.menu-btn span {
    display: block;
    height: 4px;
    width: 100%;
    background: white;
    border-radius: 2px;
    transition: all 0.3s ease;
}

/* ================= MENU LATERAL ================= */
.menu {
    position: fixed;
    top: 0;
    left: -260px;
    width: 260px;
    height: 100vh;
    background: rgba(0,0,0,0.95);
    padding: 90px 20px;
    display: flex;
    flex-direction: column;
    gap: 18px;
    transition: left 0.3s ease;
    z-index: 1500;
}

.menu.open {
    left: 0;
}

.menu button {
    width: 100%;
    padding: 14px;
    border-radius: 18px;
    border: none;
    font-size: 16px;
    font-weight: bold;
    color: white;
    cursor: pointer;
    transition: transform 0.2s, box-shadow 0.2s;
}

.menu button:hover {
    transform: scale(1.05);
    box-shadow: 0 0 15px rgba(255,255,255,0.4);
}

/* Couleurs boutons */
.menu .totk { background: #ff0000; }
.menu .smo { background: #00cc44; }
.menu .botw { background: #0066ff; }
.menu .chatsmo { background:#4c00ff; }
.menu .shorts { background: linear-gradient(135deg, #2600ff, #00ffc8); }
.menu .jumps { background: #666; }

/* Animation du hamburger -> flèche */
.menu-btn.open span:nth-child(1) {
    transform: rotate(45deg) translate(5px, 5px);
}
.menu-btn.open span:nth-child(2) {
    opacity: 0;
}
.menu-btn.open span:nth-child(3) {
    transform: rotate(-45deg) translate(5px, -5px);
}

/* ================= PAGE ================= */
.page {
    display: flex;
    justify-content: center;
    padding: 110px 15px 40px;
}

.card {
    background: rgba(0,0,0,0.88);
    border-radius: 26px;
    padding: 50px 25px;
    width: 100%;
    max-width: 520px;
    text-align: center;
    box-shadow: 0 0 45px rgba(0,0,0,0.9);
}

.profile-img {
    width: 170px;
    height: 170px;
    border-radius: 50%;
    object-fit: cover;
    border: 5px solid #ff2d2d;
    box-shadow: 0 0 30px rgba(255,0,0,0.6);
    margin-bottom: 30px;
}

h1 { font-size: 32px; margin: 10px 0; }
.subtitle { font-size: 15px; color: #ccc; margin-bottom: 35px; }

.main-btn {
    width: 100%;
    padding: 20px;
    font-size: 20px;
    border: none;
    border-radius: 16px;
    cursor: pointer;
    font-weight: bold;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
    transition: transform 0.2s, box-shadow 0.2s;
}

.subscribe { background: linear-gradient(135deg, #ff2d2d, #ff0000); margin-bottom: 22px; }
.subscribe img { width: 46px; height: 46px; border-radius: 10px; }
.later { background: linear-gradient(135deg, #444, #222); color: #ddd; }

.main-btn:hover { transform: scale(1.05); box-shadow: 0 0 28px rgba(255,255,255,0.35); }

footer { margin-top: 35px; font-size: 13px; color: #aaa; }
</style>
</head>

<body>

<!-- NAVBAR -->
<div class="navbar">
    <div class="menu-btn" id="menu-btn" onclick="toggleMenu()">
        <span></span>
        <span></span>
        <span></span>
    </div>
</div>

<!-- MENU LATERAL -->
<div class="menu" id="menu">
    <button class="totk" onclick="goTOTK()">TOTK</button>
    <button class="smo" onclick="goSMO()">SMO</button>
    <button class="botw" onclick="goBOTW()">BOTW</button>
    <button class="chatsmo" onclick="goChatSMO()">ChatSmo</button>
    <button class="shorts" onclick="goShorts()">Mes Shorts</button>
    <button class="jumps" onclick="goJumps()">Serveurs Trickjumps</button>
</div>

<div class="page">
    <div class="card">
        <img class="profile-img" src="https://yt3.ggpht.com/0DVAPHQYW8br9AR2vJF0rCaXFP2HR0yBjGZ3OKTFq0hE7-VapkyXWpT8-9ORIjT2gxoNa0kpub0=s600-c-k-c0x00ffffff-no-rj-rp-mo">

        <h1>Dani_MK</h1>
        <div class="subtitle">YouTube • Gaming • Fun 🎮🔥</div>

        <button class="main-btn subscribe" onclick="abonner()">
            <img src="https://yt3.ggpht.com/0DVAPHQYW8br9AR2vJF0rCaXFP2HR0yBjGZ3OKTFq0hE7-VapkyXWpT8-9ORIjT2gxoNa0kpub0=s600-c-k-c0x00ffffff-no-rj-rp-mo">
            S'abonner à Dani_MK
        </button>

        <button class="main-btn later" onclick="rejoindreDiscord()">
            Rejoindre le Discord
        </button>

        <footer>© 2026 • Dani_MK</footer>
    </div>
</div>

<script>
const menuBtn = document.getElementById("menu-btn");
const menu = document.getElementById("menu");

function toggleMenu() {
    menu.classList.toggle("open");
    menuBtn.classList.toggle("open");
}

function abonner() { window.open("https://www.youtube.com/channel/UCw3v5XVphqVzScmTXs-8Yrw?sub_confirmation=1", "_blank"); }
function rejoindreDiscord() { window.open("https://discord.gg/wySG6ykZ62", "_blank"); }

function goTOTK(){ location.href="totk.html"; }
function goSMO(){ location.href="smo.html"; }
function goBOTW(){ location.href="botw.html"; }
function goChatSMO(){ location.href="chatsmo.html"; }
function goJumps(){ location.href="jumps.html"; }
function goShorts(){ location.href="shorts.html"; }
</script>

</body>
</html>
