<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dani_MK</title>

<link rel="icon" href="favicon.ico" type="image/x-icon">

<style>

.section-title{
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.section-link{
  font-size:14px;
  font-weight:500;
  color:var(--muted);
  cursor:pointer;
  text-decoration:none;
  transition:color .2s ease;
}

.section-link:hover{
  text-decoration:underline;
  color:var(--text);
}


:root{
  --bg:#07070c;
  --glass:rgba(255,255,255,0.06);
  --border:rgba(255,255,255,0.08);
  --accent1:#7f5cff;
  --accent2:#00ffd5;
  --text:#f5f7fa;
  --muted:#b8bfd4;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:system-ui,Segoe UI,Arial,sans-serif;
  background:
    radial-gradient(600px 400px at 10% 10%, rgba(127,92,255,.15), transparent),
    radial-gradient(600px 400px at 90% 90%, rgba(0,255,213,.12), transparent),
    linear-gradient(180deg,#050509,#0b0b16);
  color:var(--text);
  min-height:100vh;
}

/* ===== CONTAINER ===== */
.container{
  max-width:1200px;
  margin:auto;
  padding:30px;
}

/* ===== HERO ===== */
.hero{
  display:flex;
  gap:30px;
  align-items:center;
  background:var(--glass);
  border:1px solid var(--border);
  border-radius:24px;
  padding:30px;
  backdrop-filter:blur(14px);
  box-shadow:0 20px 60px rgba(0,0,0,.6);
}

.avatar{
  width:150px;
  height:150px;
  border-radius:20px;
  overflow:hidden;
  flex-shrink:0;
}

.avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.hero h1{
  font-size:42px;
}

.hero span{
  background:linear-gradient(90deg,var(--accent1),var(--accent2));
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

.hero p{
  margin-top:10px;
  color:var(--muted);
}

.hero-actions{
  margin-top:20px;
  display:flex;
  gap:12px;
  flex-wrap:wrap;
}

/* ===== BUTTONS (SEULE PARTIE MODIFIÉE) ===== */
.btn{
  padding:12px 20px;
  border-radius:14px;
  border:none;
  cursor:pointer;
  font-weight:700;
  font-size:14px;
  transition:
    transform 0.2s ease,
    box-shadow 0.2s ease,
    background 0.2s ease;
}

.btn:hover{
  transform:scale(1.08);
}

.btn:active{
  transform:scale(0.96);
}

.btn-primary{
  background:linear-gradient(90deg,var(--accent1),var(--accent2));
  color:#050509;
  box-shadow:0 8px 24px rgba(0,0,0,.4);
}

.btn-primary:hover{
  box-shadow:0 14px 40px rgba(0,0,0,.6);
}

.btn-ghost{
  background:var(--glass);
  color:var(--text);
  border:1px solid var(--border);
}

.btn-ghost:hover{
  background:rgba(255,255,255,0.1);
}

/* ===== SECTIONS ===== */
.section{
  margin-top:40px;
}

.section h2{
  font-size:24px;
  margin-bottom:18px;
}

/* ===== SHORTS GRID ===== */
.shorts-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:22px;
}

.short-card{
  background:var(--glass);
  border:1px solid var(--border);
  border-radius:22px;
  padding:14px;
  backdrop-filter:blur(10px);
  transition:transform .25s, box-shadow .25s;
}

.short-card:hover{
  transform:translateY(-10px);
  box-shadow:0 30px 80px rgba(0,0,0,.7);
}

.short-embed{
  width:100%;
  aspect-ratio:9/16;
  border-radius:16px;
  overflow:hidden;
  background:#000;
}

.short-embed iframe{
  width:100%;
  height:100%;
  border:none;
}

.short-card h3{
  margin-top:12px;
  font-size:15px;
  color:var(--muted);
  text-align:center;
}

/* ===== BOTTOM NAV ===== */
.bottom-nav{
  position:fixed;
  bottom:18px;
  left:50%;
  transform:translateX(-50%);
  display:flex;
  gap:10px;
  padding:10px;
  background:rgba(0,0,0,.6);
  border:1px solid var(--border);
  border-radius:999px;
  backdrop-filter:blur(10px);
  z-index:1000;
}

.bottom-nav button{
  padding:10px 16px;
  border-radius:14px;
  border:none;
  background:transparent;
  color:var(--muted);
  font-weight:700;
  cursor:pointer;
  transition:transform 0.2s ease, background 0.2s ease;
}

.bottom-nav button:hover{
  transform:scale(1.08);
  background:linear-gradient(90deg,var(--accent1),var(--accent2));
  color:#050509;
}

/* ===== FOOTER ===== */
footer{
  margin-top:60px;
  text-align:center;
  color:var(--muted);
  font-size:13px;
}

/* ===== RESPONSIVE ===== */
@media(max-width:800px){
  .hero{
    flex-direction:column;
    text-align:center;
  }
  .hero-actions{
    justify-content:center;
  }
}

/* ===== LEFT BUTTONS ===== */
.left-buttons{
  position:fixed;
  left:18px;
  top:50%;
  transform:translateY(-50%);
  display:flex;
  flex-direction:column;
  gap:10px;
  z-index:1000;
}

.left-buttons .btn{
  padding:10px 16px;
  font-size:13px;
  white-space:nowrap;
}

/* ===== HERO-RIGHT BUTTONS ===== */
.hero-right{
  display:flex;
  flex-direction:column;
  gap:10px; /* un peu moins d’espace entre les boutons */
  margin-left:auto; /* pousse à droite */
}

/* style des boutons */
.hero-right .btn{
  position:relative;
  overflow:hidden;
  background:var(--glass);
  border:1px solid rgba(255,255,255,0.08);
  border-radius:12px;
  padding:12px 20px;
  font-size:14px;
  cursor:pointer;
  font-weight:700;
  transition: transform 0.25s ease, box-shadow 0.25s ease;
}

/* hover doux avec glow vert et scale */
.hero-right .btn:hover{
  transform: scale(1.08);
  box-shadow:0 6px 20px rgba(0,255,213,0.35); /* glow vert */
}

/* REFLET BLANC GLISSANT */
.hero-right .btn::after{
  content:"";
  position:absolute;
  top:-150%;
  left:-70%;
  width:50%;
  height:350%;
  background:linear-gradient(
    120deg,
    transparent,
    rgba(255,255,255,0.45),
    transparent
  );
  transform:rotate(20deg);
  transition:all .6s ease;
  pointer-events:none;
}

.hero-right .btn:hover::after{
  left:140%;
}

/* focus accessible */
.hero-right .btn:focus-visible{
  outline:none;
  box-shadow:
    0 0 0 2px var(--accent2),
    0 0 16px rgba(0,255,213,0.4);
}

/* ===== HAMBURGER + DRAWER ===== */
.hamburger,.drawer,.drawer-overlay{ display:none; }

.hamburger span{
  display:block;
  width:20px;
  height:2px;
  background:#fff;
  border-radius:2px;
  transition:transform 0.35s cubic-bezier(0.4,0,0.2,1), opacity 0.22s ease;
}
.hamburger.open span:nth-child(1){ transform:translateY(7px) rotate(45deg); }
.hamburger.open span:nth-child(2){ opacity:0; transform:scaleX(0); }
.hamburger.open span:nth-child(3){ transform:translateY(-7px) rotate(-45deg); }

@keyframes ham-pop{
  0%{ transform:scale(1); }
  45%{ transform:scale(1.22); }
  100%{ transform:scale(1); }
}

.drawer-overlay.show{ opacity:1; pointer-events:auto; }
.drawer.open{ transform:translateX(0); }

.drawer-header{
  padding:38px 20px 34px 20px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-bottom:1px solid rgba(255,255,255,0.06);
}
.drawer-title{
  font-weight:900;
  font-size:17px;
  background:linear-gradient(90deg,#7f5cff,#00ffd5);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}
.drawer-close{
  background:rgba(255,255,255,0.06);
  border:1px solid rgba(255,255,255,0.08);
  border-radius:10px;
  color:rgba(255,255,255,0.7);
  font-size:16px;
  width:34px;
  height:34px;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  flex-shrink:0;
  transition:background 0.15s,color 0.15s;
}
.drawer-close:hover{ background:rgba(255,255,255,0.12); color:#fff; }

.drawer-links{
  flex:1;
  display:flex;
  flex-direction:column;
  gap:8px;
  padding:20px 14px;
  overflow-y:auto;
}
.drawer-links button{
  width:100%;
  padding:15px 18px;
  background:rgba(255,255,255,0.04);
  border:1px solid rgba(255,255,255,0.07);
  border-radius:14px;
  color:#f5f7fa;
  font-family:inherit;
  font-weight:700;
  font-size:15px;
  cursor:pointer;
  text-align:left;
  transition:background 0.15s,transform 0.15s,border-color 0.15s;
}
.drawer-links button:hover{
  background:rgba(127,92,255,0.12);
  border-color:rgba(127,92,255,0.28);
  transform:translateX(4px);
}
.drawer-links button:active{ transform:scale(0.97); }

.drawer-footer{
  padding:14px 20px;
  padding-bottom:max(14px,env(safe-area-inset-bottom));
  font-size:12px;
  color:rgba(255,255,255,0.22);
  border-top:1px solid rgba(255,255,255,0.05);
  text-align:center;
}

/* ===== MODE HAMBURGER — quand les boutons trickjump passent sous S'abonner (≤800px) ===== */
@media(max-width:800px){

  /* Cacher la navbar, montrer hamburger */
  .bottom-nav{ display:none; }

  /* Bouton hamburger flottant en haut à gauche */
  .hamburger{
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    gap:5px;
    position:fixed;
    top:calc(env(safe-area-inset-top,0px) + 24px);
    left:25px;
    z-index:3000;
    width:48px;
    height:48px;
    background:rgba(7,7,12,0.88);
    border:1px solid rgba(255,255,255,0.14);
    border-radius:14px;
    cursor:pointer;
    backdrop-filter:blur(16px);
    box-shadow:0 8px 30px rgba(0,0,0,0.5),0 0 0 1px rgba(127,92,255,0.15);
    transition:transform 0.25s ease, background 0.35s ease, box-shadow 0.35s ease, border-color 0.35s ease;
  }
  .hamburger:active{ transform:scale(0.9); }
  .hamburger.open{ animation:ham-pop 0.32s cubic-bezier(0.34,1.56,0.64,1); }

  /* Overlay flouté */
  .drawer-overlay{
    display:block;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.55);
    backdrop-filter:blur(3px);
    z-index:1500;
    opacity:0;
    pointer-events:none;
    transition:opacity 0.3s ease;
  }

  /* Panneau latéral gauche */
  .drawer{
    display:flex;
    position:fixed;
    top:0;
    left:0;
    width:75vw;
    max-width:280px;
    height:100vh;
    height:100dvh;
    background:rgba(7,7,16,0.97);
    border-right:1px solid rgba(255,255,255,0.07);
    backdrop-filter:blur(24px);
    z-index:2000;
    flex-direction:column;
    transform:translateX(-100%);
    transition:transform 0.32s cubic-bezier(0.4,0,0.2,1);
    box-shadow:20px 0 60px rgba(0,0,0,0.5);
  }

  .container{ padding:20px 18px; }

  /* Hero-right repositionné directement sous S'abonner/Discord par le JS */
  .hero-right{
    width:100%;
    margin-left:0;
    flex-direction:row;
    flex-wrap:wrap;
    gap:12px;
    margin-top:12px;
  }
  .hero-right .btn{
    flex:1;
    min-width:140px;
    font-size:15px;
    padding:14px 20px;
  }
}

/* Ajustements supplémentaires très petits écrans */
@media(max-width:480px){
  .container{ padding:16px; }
  .hero{ padding:18px 14px; gap:14px; align-items:stretch; }
  .avatar{ width:90px; height:90px; align-self:center; }
  .hero h1{ font-size:26px; }
  .hero-right .btn{ width:100%; min-width:unset; font-size:14px; padding:16px 20px; }
  .section h2{ font-size:18px; }
  .section-link{ font-size:12px; }
  .shorts-grid{ grid-template-columns:1fr; }
}

</style>
</head>

<script>
function openLink(url){
  window.open(url,'_blank');
}
function go(page){
  window.location.href = page;
}
(function(){
  var ham=document.getElementById('hamburger');
  var drw=document.getElementById('drawer');
  var ovr=document.getElementById('drawerOverlay');

  function openDrw(){ham.classList.add('open');drw.classList.add('open');ovr.classList.add('show');document.body.style.overflow='hidden';}
  function closeDrw(){ham.classList.remove('open');drw.classList.remove('open');ovr.classList.remove('show');document.body.style.overflow='';}

  ham.addEventListener('click',function(){drw.classList.contains('open')?closeDrw():openDrw();});
  ovr.addEventListener('click',closeDrw);
  cls.addEventListener('click',closeDrw);
  document.addEventListener('keydown',function(e){if(e.key==='Escape')closeDrw();});

  /* Déplace hero-right directement sous S'abonner/Discord quand les boutons passent en-dessous (≤800px) */
  var heroRight=document.querySelector('.hero-right');
  var heroActions=document.querySelector('.hero-actions');
  var heroEl=document.querySelector('.hero');
  var moved=false;

  function updateLayout(){
    var isMobile=window.innerWidth<=800;
    if(isMobile && !moved){
      heroActions.insertAdjacentElement('afterend',heroRight);
      moved=true;
    } else if(!isMobile && moved){
      heroEl.appendChild(heroRight);
      moved=false;
      closeDrw();
    }
  }

  window.addEventListener('resize',updateLayout);
  updateLayout();
})();
</script>
