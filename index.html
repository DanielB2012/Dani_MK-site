<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dani_MK - Créateur YouTube</title>

<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">

<style>
* { box-sizing: border-box; }

html, body {
    margin: 0;
    font-family: 'Roboto', Arial, sans-serif;
    color: white;
    background: linear-gradient(135deg, #ff0000, #6a00ff);
    background-attachment: fixed;
}

/* ================= NAVBAR ================= */
.navbar {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    min-height: 70px;
    background: rgba(0,0,0,0.85);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 10px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.6);
    z-index: 1000;
    flex-wrap: wrap;
}

.nav-btn {
    flex: 1;
    min-width: 90px;
    height: 44px;
    border-radius: 18px;
    border: none;
    color: white;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    transition: transform 0.2s, box-shadow 0.2s;
}

.nav-btn.totk { background: #ff0000; }
.nav-btn.smo { background: #00cc44; }
.nav-btn.botw { background: #0066ff; }
.nav-btn.chatsmo { background:#4c00ff; }

.nav-btn:hover {
    transform: scale(1.05);
    box-shadow: 0 0 15px rgba(255,255,255,0.4);
}

/* ================= BOUTONS FIXES ================= */
.jumps-btn,
.shorts-btn {
    position: fixed;
    bottom: 20px;
    padding: 14px 24px;
    border-radius: 30px;
    border: none;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    color: white;
    z-index: 2000;
}

.jumps-btn {
    right: 20px;
    background: #666;
}

.shorts-btn {
    left: 20px;
    background: linear-gradient(135deg, #2600ff, #00ffc8);
}

/* ================= CONTENU ================= */
.page {
    display: flex;
    justify-content: center;
    padding: 100px 15px 40px;
}

/* ================= CARD ================= */
.card {
    background: rgba(0,0,0,0.88);
    border-radius: 26px;
    padding: 50px 25px;
    width: 100%;
    max-width: 520px;
    text-align: center;
    box-shadow: 0 0 45px rgba(0,0,0,0.9);
}

/* ================= PROFIL ================= */
.profile-img {
    width: 180px;
    height: 180px;
    border-radius: 50%;
    object-fit: cover;
    border: 5px solid #ff2d2d;
    box-shadow: 0 0 30px rgba(255,0,0,0.6);
    margin-bottom: 30px;
}

h1 {
    font-size: 34px;
    margin: 10px 0;
}

.subtitle {
    font-size: 15px;
    color: #ccc;
    margin-bottom: 35px;
}

/* ================= BOUTONS PRINCIPAUX ================= */
.main-btn {
    width: 100%;
    padding: 20px;
    font-size: 20px;
    border: none;
    border-radius: 16px;
    cursor: pointer;
    font-weight: bold;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
    transition: transform 0.2s, box-shadow 0.2s;
}

.subscribe {
    background: linear-gradient(135deg, #ff2d2d, #ff0000);
    margin-bottom: 22px;
    color: white;
}

.subscribe img {
    width: 48px;
    height: 48px;
    border-radius: 10px;
}

.subscribe:hover,
.later:hover {
    transform: scale(1.05);
    box-shadow: 0 0 28px rgba(255,255,255,0.35);
}

.later {
    background: linear-gradient(135deg, #444, #222);
    color: #ddd;
}

/* ================= FOOTER ================= */
footer {
    margin-top: 35px;
    font-size: 13px;
    color: #aaa;
}

/* ================= MOBILE ================= */
@media (max-width: 768px) {

    .profile-img {
        width: 140px;
        height: 140px;
    }

    h1 {
        font-size: 28px;
    }

    .subtitle {
        font-size: 14px;
    }

    .main-btn {
        font-size: 18px;
        padding: 18px;
    }

    .jumps-btn,
    .shorts-btn {
        font-size: 14px;
        padding: 12px 20px;
    }
}
</style>
</head>

<body>

<div class="navbar">

    <button class="nav-btn smo" onclick="goSMO()">SMO</button>

            S'abonner à Dani_MK
        </button>

        <button class="main-btn later" onclick="rejoindreDiscord()">
            Rejoindre le Discord
        </button>

        <footer>© 2026 • Dani_MK</footer>
    </div>
</div>

<script>

</body>
</html>
